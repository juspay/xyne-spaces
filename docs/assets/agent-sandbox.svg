<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1040" viewBox="0 0 1620 1040" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="grn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
    <marker id="org" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
    <marker id="pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be185d"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>

  <rect x="0" y="0" width="1620" height="1040" fill="#ffffff"/>

  <text x="60" y="46" font-size="25" font-weight="700" fill="#0f172a">Xyne Claw &amp; Sandbox — Layered Architecture</text>
  <text x="60" y="74" font-size="12.5" fill="#64748b">Trust flows downward: sandbox VM → xyne-claw pod → claw-auth gateway → Xyne Spaces. Every external action is executed by claw-auth; the model never holds secrets.</text>

  <!-- ══════════ 1 SPACES LAYER ══════════ -->
  <rect x="60" y="104" width="1080" height="140" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="82" y="134" font-size="15" font-weight="700" fill="#1d4ed8">1  SPACES LAYER — product / UI</text>

  <rect x="100" y="156" width="380" height="72" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="290" y="185" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Workspace user</text>
  <text x="290" y="206" font-size="11.5" fill="#475569" text-anchor="middle">@mentions the agent in a thread</text>

  <rect x="760" y="156" width="380" height="72" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="950" y="185" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Xyne Spaces API</text>
  <text x="950" y="206" font-size="11.5" fill="#475569" text-anchor="middle">renders the reply in the thread</text>

  <line x1="756" y1="192" x2="486" y2="192" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
  <rect x="551" y="182" width="138" height="21" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="620" y="196" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">user sees the answer</text>

  <!-- ══════════ 2 GATEWAY LAYER ══════════ -->
  <rect x="60" y="304" width="1080" height="250" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="82" y="334" font-size="15" font-weight="700" fill="#6d28d9">2  GATEWAY LAYER — claw-auth · Express · holds ALL secrets, verifies identity</text>

  <rect x="100" y="356" width="290" height="76" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="245" y="387" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Webhook receiver</text>
  <text x="245" y="408" font-size="11.5" fill="#475569" text-anchor="middle">verify HMAC signature</text>

  <rect x="430" y="356" width="290" height="76" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="575" y="387" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Resolve agent + creds</text>
  <text x="575" y="408" font-size="11.5" fill="#475569" text-anchor="middle">provider &amp; MCP credentials</text>

  <rect x="760" y="356" width="200" height="76" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="860" y="391" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Dispatch run</text>
  <text x="860" y="412" font-size="11.5" fill="#475569" text-anchor="middle">enqueue + checkpoint</text>

  <line x1="394" y1="394" x2="426" y2="394" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#purp)"/>
  <line x1="724" y1="394" x2="756" y2="394" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#purp)"/>

  <rect x="100" y="462" width="420" height="76" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.4"/>
  <text x="310" y="487" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Tool executor  ·  /mcp/call</text>
  <text x="310" y="507" font-size="11.5" fill="#5b21b6" text-anchor="middle">runs EVERY external tool</text>
  <text x="310" y="525" font-size="11.5" fill="#5b21b6" text-anchor="middle">and drives the sandbox-* VM lifecycle</text>

  <rect x="900" y="462" width="240" height="76" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="1020" y="494" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Post result</text>
  <text x="1020" y="515" font-size="11.5" fill="#475569" text-anchor="middle">to Spaces</text>

  <!-- ══════════ 3 RUNTIME LAYER ══════════ -->
  <rect x="60" y="614" width="1080" height="175" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="82" y="644" font-size="15" font-weight="700" fill="#15803d">3  RUNTIME LAYER — xyne-claw pod · the LLM agent loop · no secrets · no bash</text>

  <rect x="100" y="666" width="440" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="320" y="706" font-size="14.5" font-weight="700" fill="#15803d" text-anchor="middle">Built-in FS tools</text>
  <text x="320" y="728" font-size="11.5" fill="#475569" text-anchor="middle">read · write · grep · find · ls — path-scoped</text>

  <rect x="700" y="666" width="440" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="920" y="706" font-size="14.5" font-weight="700" fill="#15803d" text-anchor="middle">Agent loop</text>
  <text x="920" y="728" font-size="11.5" fill="#475569" text-anchor="middle">turn → tool → turn</text>

  <!-- ══════════ 4 SANDBOX LAYER ══════════ -->
  <rect x="60" y="849" width="1080" height="150" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="82" y="879" font-size="15" font-weight="700" fill="#c2410c">4  SANDBOX LAYER — Kata / QEMU microVM · isolated coding environment</text>

  <rect x="100" y="901" width="720" height="86" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="931" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">Isolated Linux VM · bash + noVNC live preview</text>
  <text x="460" y="953" font-size="11.5" fill="#9a3412" text-anchor="middle">EGRESS CLOSED · no network · no gateway credentials</text>
  <text x="460" y="972" font-size="11.5" font-weight="600" fill="#9a3412" text-anchor="middle">safe by isolation, not by permission</text>

  <!-- ══════════ BACKING STORES ══════════ -->
  <rect x="1220" y="304" width="340" height="250" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1240" y="334" font-size="13" font-weight="700" fill="#475569">BACKING STORES — owned by claw-auth</text>

  <rect x="1240" y="356" width="300" height="56" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1390" y="379" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Postgres / Prisma</text>
  <text x="1390" y="398" font-size="11" fill="#64748b" text-anchor="middle">agents · config · credentials</text>

  <rect x="1240" y="420" width="300" height="56" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1390" y="443" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Redis + BullMQ</text>
  <text x="1390" y="462" font-size="11" fill="#64748b" text-anchor="middle">scheduled jobs · run recovery</text>

  <rect x="1240" y="484" width="300" height="56" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1390" y="507" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">GCS</text>
  <text x="1390" y="526" font-size="11" fill="#64748b" text-anchor="middle">session checkpoints · results</text>

  <!-- ══════════ MODEL AND MEMORY ══════════ -->
  <rect x="1220" y="614" width="340" height="175" rx="14" fill="#fce7f3" stroke="#ec4899" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1240" y="644" font-size="13" font-weight="700" fill="#be185d">5  MODEL &amp; MEMORY</text>

  <rect x="1240" y="666" width="300" height="56" rx="9" fill="#ffffff" stroke="#db2777" stroke-width="1.8"/>
  <text x="1390" y="689" font-size="13" font-weight="700" fill="#be185d" text-anchor="middle">LiteLLM gateway</text>
  <text x="1390" y="708" font-size="11" fill="#64748b" text-anchor="middle">Claude · OpenAI · OpenRouter</text>

  <rect x="1240" y="730" width="300" height="56" rx="9" fill="#ffffff" stroke="#db2777" stroke-width="1.8"/>
  <text x="1390" y="753" font-size="13" font-weight="700" fill="#be185d" text-anchor="middle">Hindsight</text>
  <text x="1390" y="772" font-size="11" fill="#64748b" text-anchor="middle">long-term memory</text>

  <!-- ══════════ FLOWS ══════════ -->

  <line x1="964" y1="394" x2="1216" y2="394" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#gray)"/>
  <rect x="1005" y="384" width="166" height="21" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1088" y="398" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">persist · enqueue · checkpoint</text>

  <line x1="290" y1="228" x2="290" y2="352" stroke="#2563eb" stroke-width="2.4" marker-end="url(#blue)"/>
  <rect x="197" y="264" width="186" height="22" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="290" y="279" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">1 · HMAC-signed webhook</text>

  <line x1="860" y1="432" x2="860" y2="662" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#purp)"/>
  <rect x="769" y="560" width="182" height="22" rx="11" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="860" y="575" font-size="10.5" font-weight="600" fill="#6d28d9" text-anchor="middle">2 · POST /run · S2S service</text>

  <line x1="1144" y1="694" x2="1236" y2="694" stroke="#be185d" stroke-width="2.4" marker-end="url(#pink)"/>
  <rect x="1143" y="660" width="94" height="21" rx="10" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="1190" y="674" font-size="10.5" font-weight="600" fill="#be185d" text-anchor="middle">3 · LLM turns</text>

  <line x1="1144" y1="748" x2="1236" y2="748" stroke="#be185d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pink)"/>
  <rect x="1145" y="762" width="90" height="21" rx="10" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="1190" y="776" font-size="10.5" font-weight="600" fill="#be185d" text-anchor="middle">memory-search</text>

  <path d="M 740 662 L 740 596 L 300 596 L 300 544" fill="none" stroke="#15803d" stroke-width="2.4" marker-end="url(#grn)"/>
  <rect x="396" y="586" width="250" height="22" rx="11" fill="#ffffff" stroke="#86efac"/>
  <text x="521" y="601" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">4 · POST /mcp/call · 6h HMAC session token</text>

  <path d="M 96 500 L 36 500 L 36 822 L 700 822 L 700 897" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#org)"/>
  <rect x="140" y="811" width="330" height="22" rx="11" fill="#ffffff" stroke="#fdba74"/>
  <text x="305" y="826" font-size="10.5" font-weight="600" fill="#c2410c" text-anchor="middle">5 · sandbox-* create / run / write / read — control plane only</text>

  <line x1="1020" y1="662" x2="1020" y2="542" stroke="#15803d" stroke-width="2.4" marker-end="url(#grn)"/>
  <rect x="947" y="592" width="146" height="22" rx="11" fill="#ffffff" stroke="#86efac"/>
  <text x="1020" y="607" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">6 · completion callback</text>

  <line x1="1090" y1="462" x2="1090" y2="232" stroke="#2563eb" stroke-width="2.4" marker-end="url(#blue)"/>
  <rect x="1035" y="264" width="110" height="22" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1090" y="279" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">7 · post reply</text>
</svg>
