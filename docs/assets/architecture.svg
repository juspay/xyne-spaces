  <rect x="620" y="271" width="300" height="68" rx="9" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="770" y="298" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Zero endpoints</text>
