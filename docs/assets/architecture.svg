  <rect x="954" y="103" width="330" height="64" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1119" y="129" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Public and external web</text>
