  <line x1="1120" y1="42" x2="1164" y2="42" stroke="#059669" stroke-width="2.4" marker-end="url(#bw)"/>
  <text x="1174" y="46" font-size="12" font-weight="600" fill="#059669">backward — result, live sync</text>

  <!-- ================= 01 CLIENTS ================= -->
