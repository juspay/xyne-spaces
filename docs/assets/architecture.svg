  <text x="76" y="484" font-size="13" font-weight="700" fill="#b45309" letter-spacing="0.04em">ACCESS</text>
  <text x="76" y="502" font-size="13" font-weight="700" fill="#b45309" letter-spacing="0.04em">CONTROL</text>

