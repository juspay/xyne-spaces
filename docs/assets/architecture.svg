  <rect x="824" y="969" width="460" height="64" rx="9" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1054" y="995" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Claw Auth</text>
