  <rect x="775" y="446" width="509" height="64" rx="9" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <path d="M 801 462 L 823 462 L 823 480 Q 823 492 812 497 Q 801 492 801 480 Z" fill="#b45309"/>
  <path d="M 807 478 L 811 483 L 819 471" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
