  <text x="76" y="142" font-size="13" font-weight="700" fill="#1d4ed8" letter-spacing="0.04em">CLIENTS</text>

  <rect x="240" y="103" width="330" height="64" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
