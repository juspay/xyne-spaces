  <text x="762" y="1178" font-size="11.5" fill="#475569" text-anchor="middle">50+ tool integrations</text>

  <rect x="954" y="1133" width="330" height="64" rx="9" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="1119" y="1159" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Connectors</text>
  <text x="1119" y="1178" font-size="11.5" fill="#475569" text-anchor="middle">Slack · Jira · Confluence · Gmail · Microsoft</text>

  <!-- ================= FORWARD / BACKWARD SPINE ================= -->
  <line x1="360" y1="194" x2="360" y2="236" stroke="#334155" stroke-width="2.4" marker-end="url(#fw)"/>
