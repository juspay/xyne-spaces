  <line x1="440" y1="240" x2="440" y2="198" stroke="#059669" stroke-width="2.4" marker-end="url(#bw)"/>
  <text x="452" y="221" font-size="11" font-weight="600" fill="#059669">live updates over WebSocket</text>

  <line x1="620" y1="370" x2="620" y2="412" stroke="#334155" stroke-width="2.4" marker-end="url(#fw)"/>
  <text x="608" y="397" font-size="11" font-weight="600" fill="#334155" text-anchor="end">request + user identity</text>
  <line x1="700" y1="416" x2="700" y2="374" stroke="#059669" stroke-width="2.4" marker-end="url(#bw)"/>
  <text x="712" y="397" font-size="11" font-weight="600" fill="#059669">authorized result</text>

  <line x1="620" y1="540" x2="620" y2="582" stroke="#334155" stroke-width="2.4" marker-end="url(#fw)"/>
  <text x="608" y="567" font-size="11" font-weight="600" fill="#334155" text-anchor="end">scoped query · wrapped mutation</text>
  <line x1="700" y1="586" x2="700" y2="544" stroke="#059669" stroke-width="2.4" marker-end="url(#bw)"/>
  <text x="712" y="567" font-size="11" font-weight="600" fill="#059669">permitted rows only</text>

  <line x1="620" y1="704" x2="620" y2="746" stroke="#334155" stroke-width="2.4" marker-end="url(#fw)"/>
  <text x="608" y="731" font-size="11" font-weight="600" fill="#334155" text-anchor="end">read · write · index</text>
  <line x1="700" y1="750" x2="700" y2="708" stroke="#059669" stroke-width="2.4" marker-end="url(#bw)"/>
  <text x="712" y="731" font-size="11" font-weight="600" fill="#059669">rows + search hits</text>

  <!-- agent plane down to outside world -->
  <line x1="450" y1="1037" x2="415" y2="1102" stroke="#334155" stroke-width="2.2" marker-end="url(#fw)"/>
  <line x1="1000" y1="1037" x2="800" y2="1102" stroke="#334155" stroke-width="2.2" marker-end="url(#fw)"/>

  <!-- ===== replication: postgres back up to zero-cache ===== -->
  <path d="M 236 823 L 32 823 L 32 356 L 390 356 L 390 343" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#bw)"/>
  <rect x="6" y="450" width="21" height="250" rx="5" fill="#ffffff"/>
  <text x="17" y="575" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle" transform="rotate(-90 17 575)">logical replication keeps the replica live</text>

  <!-- ===== agent plane into the edge ===== -->
  <path d="M 1288 1001 L 1330 1001 L 1330 290 L 1292 290" fill="none" stroke="#7e22ce" stroke-width="2.4" marker-start="url(#pu)" marker-end="url(#pu)"/>
  <rect x="1338" y="500" width="21" height="330" rx="5" fill="#ffffff"/>
  <text x="1349" y="665" font-size="11.5" font-weight="600" fill="#7e22ce" text-anchor="middle" transform="rotate(-90 1349 665)">agent runs invoked · context read as the user, same ACLs</text>

  <!-- ===== connectors into the edge ===== -->
  <path d="M 1288 1165 L 1390 1165 L 1390 322 L 1292 322" fill="none" stroke="#be123c" stroke-width="2.4" marker-start="url(#rd)" marker-end="url(#rd)"/>
  <rect x="1398" y="620" width="21" height="240" rx="5" fill="#ffffff"/>
  <text x="1409" y="740" font-size="11.5" font-weight="600" fill="#be123c" text-anchor="middle" transform="rotate(-90 1409 740)">webhooks in · scheduled pulls out</text>
