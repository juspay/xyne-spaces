# Gitleaks configuration for xyne-spaces
# Used by:
#   - .husky/pre-commit  -> `gitleaks git --staged`  (blocks secrets before commit)
#   - release audit       -> `gitleaks dir .`         (whole-tree scan before open-source)
#
# NOTE on suppression — ALL accepted findings go HERE (line-number-FREE, so merges/edits don't
# re-trigger). We intentionally do NOT use a .gitleaksignore file — its fingerprints are
# `file:rule:LINE` and break the moment a line moves (the merge problem we were hitting).
#   - Whole files that are safe by design      -> [allowlist].paths    (e.g. google-services.json)
#   - Specific accepted VALUES (tokens/ids/FPs) -> [allowlist].regexes  (matched ANYWHERE; a NEW
#     secret in the same file is still caught).
# If the pre-commit hook blocks a PUBLIC/SAFE finding, add a path or regex here and re-commit.

# Inherit gitleaks' built-in default rules.
[extend]
useDefault = true

[allowlist]
description = "Global path allowlist (build output, vendored, and test fixtures)"
paths = [
  # Dependencies / vendored
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)Pods/''',

  # Build / release artifacts (already gitignored, never shipped)
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''\.gradle/''',
  '''(^|/)apps/electron/release/''',
  '''(^|/)\.vite/''',

  # CI security-scan scratch: downloaded scanner binaries + generated reports
  '''(^|/)\.securitybin/''',
  '''(^|/)security-reports/''',

  # Automation-suite run artifacts: Gauge HTML reports and captured container
  # logs. Gitignored and never committed, but `gitleaks dir` walks the working
  # tree regardless of .gitignore, and service logs are full of session tokens
  # that trip generic-api-key.
  '''(^|/)xyne-automation/reports/''',

  # Signing material — must never be committed; flag via separate policy, not scan noise
  '''\.keystore$''',
  '''\.jks$''',

  # Test fixtures / mocks that intentionally contain fake secrets
  '''(^|/)__tests__/''',
  '''(^|/)__mocks__/''',
  '''\.test\.(ts|tsx|js|jsx|mjs|cjs)$''',
  '''\.spec\.(ts|tsx|js|jsx|mjs|cjs)$''',

  # Lockfiles (dependency checksums, not secrets)
  '''(^|/)Podfile\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)yarn\.lock$''',

  # Firebase config — google-services.json is public-by-design client config (any flavor/location)
  '''(^|/)google-services\.json$''',

  # This config file itself — so the accepted values in `regexes` below don't self-flag
  '''(^|/)\.gitleaks\.toml$''',
]

# Accepted VALUES — safe/public tokens, public identifiers, and false positives.
# Matched against the detected secret ANYWHERE it appears → no line numbers, merge-proof.
# A brand-new/different secret in the same file is still caught.
regexes = [
  # Mixpanel client-side analytics token (apps/xyne-spaces/.env.*, lotus/.env.*, Jenkinsfile)
  '''ca5b322f4175470400f68cddf319f2d5''',
  # Firebase Storage download token on the public "download the app" page (apps/public-web/public/index.html)
  '''03f41183-48fd-4658-bedf-b21a86de6114''',
  # Internal Euler repo UUIDs — identifiers, not credentials (integrityDebugWorkflow.ts)
  '''8cbe7e27-7ead-4aca-8ca1-f84dc417a50a''',
  '''47f190fd-0c7c-4e0b-bd77-4c5fe216f023''',
  # Claude OAuth *client id* — public identifier (claude-oauth-refresh.ts)
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',
  # False positives: variable references, not literal secrets (config/env.ts)
  '''envVars\.(XYNE_CLAW_S2S_KEY|INTERNAL_S2S_KEY|ENC_S2S_KEY)''',
  # False positives: test-fixture labels (testAuthSeeder.ts)
  '''(dm-fixtures-v1|thread-fixtures-v2)''',
  # Keyboard-shortcut chords in the shortcuts catalog — `keys: '<chord>'` trips generic-api-key
  # (apps/dashboard/src/shortcuts/catalog.ts). Anchored: the whole value must be a modifier+key chord.
  '''^(mod|cmd|ctrl|alt|shift|meta)\+[a-z0-9+]+$''',
  # UI local-storage key, not a credential (ErrorPipelinePageV3.tsx).
  '''^errpipe-detail-width-v2$''',
]

# ---------------------------------------------------------------------------
# Base64-wrapped secrets.
#
# Added after a history audit found credentials that every plaintext rule
# missed because the value was base64-encoded before being committed:
#   * a GCP service-account JSON (with its RSA private key) stored in
#     FCM_SERVICE_ACCOUNT_BASE64
#   * a cachix auth token stored as `$(echo -e "<base64>" | base64 -d)`,
#     split with \n so it did not even look like one long token
#
# gitleaks does not decode before matching, so these rules target the
# ENCODED form. "ewogICJ0eXBlIjogInNlcnZpY2VfYWNjb3VudCI" is the base64 of
# '{\n  "type": "service_account"'; "eyJhbGciOi" is the base64 of '{"alg":'
# and "ZXlKaGJHY2lPaU" is that same string base64-encoded a second time.
# ---------------------------------------------------------------------------

[[rules]]
id = "base64-gcp-service-account"
description = "GCP service account JSON stored base64-encoded (e.g. *_BASE64 env vars)"
regex = '''ewogICJ0eXBlIjog?ImVzZXJ2aWNlX2FjY291bnQi|ewogICJ0eXBlIjogInNlcnZpY2VfYWNjb3VudCI|eyJ0eXBlIjoic2VydmljZV9hY2NvdW50Ig'''
keywords = ["ewogICJ0eXBl", "eyJ0eXBlIjoic2Vydmlj"]

[[rules]]
id = "double-base64-jwt"
description = "JWT that has been base64-encoded a second time to evade secret scanning"
regex = '''ZXlKaGJHY2lPaU[A-Za-z0-9+/=]{10,}'''
keywords = ["ZXlKaGJHY2lPaU"]

[[rules]]
id = "decode-at-runtime-literal"
description = "Inline literal piped through base64 -d / atob at runtime (classic scanner evasion)"
regex = '''(?:base64\s+-d|base64\s+--decode|atob\s*\()[^\n]{0,20}["'][A-Za-z0-9+/=\\n]{60,}["']|["'][A-Za-z0-9+/=\\n]{60,}["'][^\n]{0,20}\|\s*base64\s+-{1,2}d'''
keywords = ["base64 -d", "base64 --decode", "atob("]

[[rules]]
id = "pomerium-session-cookie"
description = "Pomerium SSO session cookie hardcoded in source"
regex = '''_pomerium=eyJ[A-Za-z0-9_.\-]{40,}'''
keywords = ["_pomerium="]

[[rules]]
id = "tracked-env-local"
description = "Per-developer .env.local must never be committed"
path = '''(^|/)\.env\.local$'''
regex = '''.'''
