# VictoriaMetrics Scrape Configuration
# Built-in scraper (replaces vmagent)
#
# Targets default to a local VictoriaMetrics pair. If your dev environment
# scrapes a shared remote metrics host instead, point the targets below at it.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'vespa-data-ingest'
    scrape_interval: 10s
    metrics_path: /prometheus/v1/values
    params:
      consumer: ['vespa']
    static_configs:
      - targets: ['localhost:8080', 'localhost:8081']
        labels:
          env: 'development'
          service: 'vespa'
