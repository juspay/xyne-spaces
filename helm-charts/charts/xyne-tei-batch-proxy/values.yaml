global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: tei-batch-proxy

image:
  registry: ""
  repository: xyne-spaces-tei-batch-proxy
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

version: ""
versionedName: false
workloadKind: Deployment

replicaCount: 1
revisionHistoryLimit: 10
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

command: []
args: []

containerPorts:
  - name: http
    containerPort: 8088
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 8088
      targetPort: http

env:
  PORT: "8088"
  UPSTREAM_EMBEDDINGS_URL: http://vespa-embedder:80/v1/embeddings
  EMBEDDINGS_BATCH_SIZE: "512"
  UPSTREAM_CONCURRENCY: "4"
  REQUEST_TIMEOUT_MS: "120000"
  MAX_RETRIES: "0"
  RETRY_BASE_MS: "1000"
  PROXY_PAYLOAD_LIMIT_BYTES: "200000000"

secretEnv: {}
envFromSecrets: []
envFromConfigMaps: []
extraEnv: []

startupProbe: {}
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
lifecycle: {}

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

podSecurityContext: {}
securityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

commonLabels: {}
podLabels: {}
podAnnotations:
  traffic.sidecar.istio.io/includeInboundPorts: "8088"
  traffic.sidecar.istio.io/includeOutboundPorts: "8088"
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinityPreset: soft
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 30
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

initContainers: []
sidecars: []

volumes: []
volumeMounts: []

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /data
  subPath: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  unhealthyPodEvictionPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

istio:
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    timeout: ""
    retries: {}
    http: []
  destinationRule:
    enabled: false
    exportTo: []
    trafficPolicy: {}
    subsets: []

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: ""

extraObjects: []
