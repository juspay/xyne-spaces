global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

image:
  registry: docker.io
  repository: redis
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

version: ""
versionedName: false
workloadKind: StatefulSet

statefulset:
  serviceName: ""
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

replicaCount: 1
revisionHistoryLimit: 3
strategy: {}

command:
  - redis-server
args:
  - --requirepass
  - $(REDIS_PASSWORD)
  - --appendonly
  - "yes"
  - --dir
  - /data

containerPorts:
  - name: tcp-redis
    containerPort: 6379
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  clusterIP: ""
  annotations: {}
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: tcp-redis

env: {}

secretEnv: {}

envFromSecrets: []
envFromConfigMaps: []
extraEnv: []

startupProbe: {}
livenessProbe:
  tcpSocket:
    port: tcp-redis
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: tcp-redis
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
lifecycle: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podSecurityContext:
  fsGroup: 999
securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

commonLabels: {}
podLabels: {}
podAnnotations: {}
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinityPreset: ""
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 30
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

initContainers: []
sidecars: []

volumes: []
volumeMounts: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  mountPath: /data
  subPath: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 0
  targetMemoryUtilizationPercentage: 0
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  unhealthyPodEvictionPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

istio:
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    timeout: ""
    retries: {}
    http: []
  destinationRule:
    enabled: false
    exportTo: []
    trafficPolicy: {}
    subsets: []

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  port: tcp-redis
  path: /metrics
  interval: 30s
  scrapeTimeout: ""

extraObjects: []

auth:
  existingSecret: xyne-redis-auth
  existingSecretKey: password
