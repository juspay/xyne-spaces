{{- /*
Lets this service claim Kata sandboxes for workflow CODE steps / run_code
(WORKFLOWS_SANDBOX_BACKEND=kata). Namespaced Role in the sandbox namespace, not a
ClusterRole: the service only ever touches SandboxClaims/Sandboxes there.
Requires serviceAccount.automount=true so @kubernetes/client-node can load in-cluster creds.
*/ -}}
{{- if .Values.sandboxRbac.create }}
{{- $ns := .Values.sandboxRbac.namespace | default .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "xyne-common.fullname" . }}-sandboxclaims
  namespace: {{ $ns }}
  labels:
    {{- include "xyne-common.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "xyne-common.fullname" . }}-sandboxclaims
  namespace: {{ $ns }}
  labels:
    {{- include "xyne-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "xyne-common.fullname" . }}-sandboxclaims
subjects:
  - kind: ServiceAccount
    name: {{ include "xyne-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
