global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: vespa-embedder

image:
  registry: ghcr.io
  repository: huggingface/text-embeddings-inference
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

version: ""
versionedName: false
workloadKind: Deployment

replicaCount: 1
revisionHistoryLimit: 10
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

command: []
args:
  - --model-id
  - BAAI/bge-base-en-v1.5
  - --port
  - "3000"
  - --dtype
  - float32
  - --max-client-batch-size
  - "1000"
  - --max-batch-requests
  - "1000"
  - --auto-truncate

containerPorts:
  - name: http
    containerPort: 3000
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 80
      targetPort: http

env:
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility

secretEnv: {}
envFromSecrets: []
envFromConfigMaps: []
extraEnv: []

startupProbe: {}
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
lifecycle: {}

resources:
  requests:
    nvidia.com/gpu: "1"
  limits:
    nvidia.com/gpu: "1"

podSecurityContext: {}
securityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

commonLabels: {}
podLabels: {}
podAnnotations:
  sidecar.istio.io/inject: "false"
deploymentAnnotations: {}

nodeSelector: {}
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
affinity: {}
podAntiAffinityPreset: ""
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 30
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

initContainers: []
sidecars: []

volumes: []
volumeMounts: []

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  mountPath: /data
  subPath: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 0
  targetMemoryUtilizationPercentage: 0
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  unhealthyPodEvictionPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

istio:
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    timeout: ""
    retries: {}
    http: []
  destinationRule:
    enabled: false
    exportTo: []
    trafficPolicy: {}
    subsets: []

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: ""

extraObjects: []
