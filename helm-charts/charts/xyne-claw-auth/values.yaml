global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: juspay/xyne-spaces-claw-auth-backend
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

version: ""
versionedName: false

replicaCount: 2
revisionHistoryLimit: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

command: []
args: []

containerPorts:
  - name: http
    containerPort: 3003
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 3003
      targetPort: http
    - name: http-80
      port: 80
      targetPort: http

env:
  NODE_ENV: production
  AUTH_SERVICE_PORT: "3003"
  AUTH_SERVICE_URL: http://localhost:3003
  AUTH_SERVICE_INTERNAL_URL: http://xyne-claw-auth:3003
  XYNE_CLAW_URL: http://xyne-claw:8081
  SPACES_BACKEND_URL: http://xyne-backend
  XYNE_SPACES_CALLBACK_URL: http://xyne-backend/api/agent/result
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  DEFAULT_AGENT_SLUG: digital-twin
  CLAW_ADMIN_EMAILS: ""
  STORAGE_PROVIDER: s3
  S3_BUCKET_NAME: xyne-claw-chat-attachments
  GCS_PROJECT_ID: ""
  GCS_BUCKET_NAME: xyne-claw-chat-attachments
  RUN_RECOVERY_MAX_RETRIES: "3"
  RUN_RECOVERY_TIMEOUT_MS: "900000"
  RUN_RECOVERY_BACKOFF_MS: "30000"
  ENABLE_OTEL_METRICS: "false"
  OTEL_SERVICE_NAME: xyne-claw-auth

secretEnv:
  DATABASE_URL:
    name: xyne-claw-auth-secrets
    key: DATABASE_URL
  ENCRYPTION_KEY:
    name: xyne-claw-auth-secrets
    key: ENCRYPTION_KEY
  XYNE_CLAW_S2S_KEY:
    name: xyne-claw-auth-secrets
    key: XYNE_CLAW_S2S_KEY
  INTERNAL_S2S_KEY:
    name: xyne-claw-auth-secrets
    key: INTERNAL_S2S_KEY
  SPACES_DB_URL:
    name: xyne-claw-auth-secrets
    key: SPACES_DB_URL
    optional: true
  REDIS_PASSWORD:
    name: xyne-claw-auth-secrets
    key: REDIS_PASSWORD
    optional: true
  GOOGLE_CLIENT_ID:
    name: xyne-claw-auth-secrets
    key: GOOGLE_CLIENT_ID
    optional: true
  GOOGLE_CLIENT_SECRET:
    name: xyne-claw-auth-secrets
    key: GOOGLE_CLIENT_SECRET
    optional: true
  MICROSOFT_CLIENT_ID:
    name: xyne-claw-auth-secrets
    key: MICROSOFT_CLIENT_ID
    optional: true
  MICROSOFT_CLIENT_SECRET:
    name: xyne-claw-auth-secrets
    key: MICROSOFT_CLIENT_SECRET
    optional: true
  AWS_ACCESS_KEY_ID:
    name: xyne-claw-auth-secrets
    key: AWS_ACCESS_KEY_ID
    optional: true
  AWS_SECRET_ACCESS_KEY:
    name: xyne-claw-auth-secrets
    key: AWS_SECRET_ACCESS_KEY
    optional: true

envFromSecrets: []
envFromConfigMaps: []
extraEnv: []

startupProbe: {}
livenessProbe:
  httpGet:
    path: /claw/health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /claw/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5
lifecycle: {}

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi

podSecurityContext:
  fsGroup: 1001
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

commonLabels: {}
podLabels: {}
podAnnotations: {}
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinityPreset: soft
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 60
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

initContainers: []
sidecars: []

volumes: []
volumeMounts: []

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /data
  subPath: ""
  annotations: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics: []
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

pdb:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spaces.example.com
      paths:
        - path: /claw/
          pathType: Prefix
  tls: []

istio:
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    timeout: 3600s
    retries: {}
    http: []
  destinationRule:
    enabled: false
    exportTo: []
    trafficPolicy: {}
    subsets: []

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: ""

migrations:
  enabled: true
  secretName: xyne-claw-auth-secrets
  secretKeys:
    - DATABASE_URL
  workingDir: /repo/apps/xyne-claw-auth/backend
  schemas:
    - prisma/schema.prisma
  backoffLimit: 2
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

extraObjects: []
