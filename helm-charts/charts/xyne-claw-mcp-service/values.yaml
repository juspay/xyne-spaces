global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: juspay/xyne-spaces-claw-mcp-service
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

version: ""
versionedName: false

# Sessions live in the pod's memory, keyed by the x-mcp-session-key header.
replicaCount: 1
revisionHistoryLimit: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

command: []
args: []

containerPorts:
  - name: http
    containerPort: 3010
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 3010
      targetPort: http

env:
  NODE_ENV: production
  CLAW_MCP_PORT: "3010"
  SPACES_BACKEND_URL: http://xyne-backend
  # Comma list of internal hosts http MCP launches may reach.
  MCP_ALLOWED_HTTP_HOSTS: ""
  OTEL_SERVICE_NAME: xyne-claw-mcp-service

secretEnv:
  # Public keys of the callers, {"<kid>": "<SPKI PEM>"}.
  CLAW_SERVICE_PUBLIC_KEYS:
    name: xyne-claw-mcp-service-secrets
    key: CLAW_SERVICE_PUBLIC_KEYS
  CLAW_ENCRYPTION_PUBLIC_KEYS:
    name: xyne-claw-mcp-service-secrets
    key: CLAW_ENCRYPTION_PUBLIC_KEYS
    optional: true

envFromSecrets: []
envFromConfigMaps: []
extraEnv: []

startupProbe: {}
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5
lifecycle: {}

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

# The image's distroless nonroot user.
podSecurityContext:
  fsGroup: 65532
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

commonLabels: {}
podLabels: {}
podAnnotations: {}
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinityPreset: soft
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 60
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

initContainers: []
sidecars: []

volumes: []
volumeMounts: []

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /data
  subPath: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  unhealthyPodEvictionPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

istio:
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    timeout: 3600s
    retries: {}
    http: []
  destinationRule:
    enabled: false
    exportTo: []
    trafficPolicy: {}
    subsets: []

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: ""

migrations:
  enabled: false

extraObjects: []
