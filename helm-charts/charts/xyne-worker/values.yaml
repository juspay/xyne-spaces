global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: juspay/xyne-spaces-backend
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

version: ""
versionedName: false

replicaCount: 1
revisionHistoryLimit: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

command:
  - pnpm
  - run
  - start:worker
args: []

containerPorts:
  - name: http
    containerPort: 3001
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: http-app
      port: 3001
      targetPort: http

env:
  NODE_ENV: production
  LOG_LEVEL: info
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  STORAGE_PROVIDER: s3
  ENABLE_OTEL_METRICS: "false"
  VESPA_FEED_URL: http://vespa-feed:8080
  VESPA_QUERY_URL: http://vespa-search:8080
  ENABLE_VESPA_WORKER: "false"
  VESPA_WORKER_QUEUE_NAME: vespa-ingestion
  ENABLE_VESPA_FILE_WORKER: "false"
  ENABLE_NOTIFICATION_WORKER: "false"
  ENABLE_AUTOMATION_WORKER: "false"
  ENABLE_WORKFLOWS_WORKER: "false"
  ENABLE_CONVERSATION_INGESTION_WORKER: "false"
  ENABLE_DOCUMENT_INGESTION_WORKER: "false"
  ENABLE_DATA_SOURCE_INGESTION_WORKER: "false"
  ENABLE_SCHEDULED_MESSAGE_WORKER: "false"
  ENABLE_DELAYED_MESSAGE_WORKER: "false"
  ENABLE_EMAIL_FETCH_WORKER: "false"
  ENABLE_EMAIL_CLASSIFICATION_WORKER: "false"
  ENABLE_CALENDAR_SYNC_WORKER: "false"
  ENABLE_ACTIVITY_CLASSIFICATION_WORKER: "false"
  ENABLE_TICKET_CLEANUP_WORKER: "false"
  ENABLE_CALL_VALIDATION_WORKER: "false"
  ENABLE_WORKER_SCHEDULER: "false"
  ENABLE_WORKFLOW_RECOVERY: "false"

secretEnv:
  DATABASE_URL:
    name: xyne-backend-secrets
    key: DATABASE_URL
  REDIS_URL:
    name: xyne-backend-secrets
    key: REDIS_URL
  JWT_SECRET:
    name: xyne-backend-secrets
    key: JWT_SECRET
  ENCRYPTION_KEY:
    name: xyne-backend-secrets
    key: ENCRYPTION_KEY
  INTERNAL_S2S_KEY:
    name: xyne-backend-secrets
    key: INTERNAL_S2S_KEY

envFromSecrets: []
envFromConfigMaps: []
extraEnv: []

startupProbe: {}
livenessProbe: {}
readinessProbe: {}
lifecycle: {}

resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    memory: 8Gi

podSecurityContext:
  fsGroup: 1001
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

commonLabels: {}
podLabels: {}
podAnnotations: {}
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinityPreset: soft
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 60
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

initContainers: []
sidecars: []

volumes:
  - name: logs
    emptyDir: {}
volumeMounts:
  - name: logs
    mountPath: /repo/apps/backend/logs

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /data
  subPath: ""
  annotations: {}

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics: []
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      selectPolicy: Max
      policies:
        - type: Percent
          value: 5
          periodSeconds: 120

pdb:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spaces.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

istio:
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    timeout: 50s
    retries: {}
    http: []
  destinationRule:
    enabled: false
    exportTo: []
    trafficPolicy: {}
    subsets: []

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: ""

extraObjects: []
