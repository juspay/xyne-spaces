{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "xyne-common.fullname" . }}-sandboxclaims
  labels:
    {{- include "xyne-common.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "xyne-common.fullname" . }}-sandboxclaims
  labels:
    {{- include "xyne-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "xyne-common.fullname" . }}-sandboxclaims
subjects:
  - kind: ServiceAccount
    name: {{ include "xyne-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
