global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: vespa-configserver

image:
  registry: ""
  repository: vespaengine/vespa
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

version: ""
versionedName: false
workloadKind: StatefulSet

statefulset:
  serviceName: ""
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

replicaCount: 1
revisionHistoryLimit: 10
strategy: {}

command: []
args: []

containerPorts:
  - name: http
    containerPort: 19071
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  clusterIP: None
  annotations: {}
  ports:
    - name: http
      port: 19071
      targetPort: http

env:
  VESPA_CONFIGSERVERS: vespa-configserver-0.vespa-configserver.{{ .Release.Namespace }}.svc.cluster.local

secretEnv: {}
envFromSecrets: []
envFromConfigMaps: []
extraEnv: []

startupProbe: {}
livenessProbe: {}
readinessProbe:
  httpGet:
    path: /state/v1/health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 20
lifecycle: {}

resources:
  requests:
    memory: 4Gi
  limits:
    memory: 8Gi

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsUser: 1000
securityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

commonLabels: {}
podLabels: {}
podAnnotations:
  sidecar.istio.io/inject: "false"
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinityPreset: hard
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 30
hostAliases: []
dnsPolicy: ""
dnsConfig: {}

initContainers: []
sidecars: []

volumes: []
volumeMounts: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  mountPath: /opt/vespa/var
  subPath: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 0
  targetMemoryUtilizationPercentage: 0
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  unhealthyPodEvictionPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

istio:
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    timeout: ""
    retries: {}
    http: []
  destinationRule:
    enabled: false
    exportTo: []
    trafficPolicy: {}
    subsets: []

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: ""

extraObjects: []
