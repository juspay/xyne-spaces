{{- range $s := .Values.overlay.sources }}
{{- $source := dict }}
{{- if $s.chart }}
{{- $source = include "xyne-root.helmSource" (dict "root" $ "repoURL" $s.repoURL "chart" $s.chart "targetRevision" ($s.chartVersion | default $s.targetRevision) "releaseName" $s.name "values" ($s.helmValues | default "" | fromYaml)) | fromYaml }}
{{- else }}
{{- $source = dict "repoURL" $s.repoURL "targetRevision" ($s.targetRevision | default "main") "path" $s.path }}
{{- if $s.helmValues }}
{{- $_ := set $source "helm" (dict "releaseName" $s.name "values" $s.helmValues) }}
{{- end }}
{{- end }}
{{- include "xyne-root.application" (dict "root" $ "name" $s.name "namespace" ($s.namespace | default $.Values.global.namespace) "wave" 2 "source" $source) }}
{{- end }}
