{{- $cm := .Values.addons.certManager }}
{{- $istio := .Values.addons.istio }}
{{- $pc := .Values.addons.platformConfig | default dict }}
{{- $sc := $pc.storageClass | default dict }}
{{- $ing := include "xyne-root.ingress" . | fromYaml }}
{{- $argo := .Values.argocd.expose | default dict }}
{{- $argoHost := $argo.host | default (printf "argocd.%s" .Values.global.domain) }}
{{- $wf := .Values.addons.workflows }}
{{- $wfExpose := and $wf.enabled $wf.expose.enabled }}
{{- $wfHost := $wf.expose.host | default (printf "workflows.%s" .Values.global.domain) }}
{{- $wildcard := or $cm.wildcard (eq $ing.tls "internal") }}
{{- $extraHosts := list }}
{{- if and $argo.enabled (not $wildcard) }}
{{- $extraHosts = append $extraHosts $argoHost }}
{{- end }}
{{- if and $wfExpose (not $wildcard) }}
{{- $extraHosts = append $extraHosts $wfHost }}
{{- end }}
{{- $base := dict
  "domain" .Values.global.domain
  "namespace" .Values.global.namespace
  "gateway" (dict "namespace" $istio.gatewayNamespace "name" "xyne-gateway" "selector" (dict "istio" "ingressgateway") "tlsSecret" $ing.tlsSecret "httpsRedirect" (not $ing.edgeTerminated) "edgeTerminated" $ing.edgeTerminated "tls" $ing.tls "extraHosts" $extraHosts)
  "certManager" (dict "enabled" (and $cm.enabled (not (has $ing.tls (list "existing" "none")))) "mode" $ing.tls "email" $cm.email "issuer" $cm.issuer "server" $cm.server "wildcard" $wildcard)
  "argocd" (dict "enabled" ($argo.enabled | default false) "host" $argoHost "namespace" .Release.Namespace)
  "workflows" (dict "enabled" $wfExpose "host" $wfHost "namespace" $wf.namespace)
  "peerAuthentication" (dict "enabled" (ne $istio.peerAuthentication "") "mode" ($istio.peerAuthentication | default "STRICT"))
  "routes" (dict "externalDashboard" ((index .Values.apps "xyne-dashboard-external").enabled | default false) "clawAuth" ((index .Values.apps "xyne-claw-auth").enabled | default false) "clawAuthFrontend" ((index .Values.apps "xyne-claw-auth-frontend").enabled | default false) "clawPreview" (and .Values.addons.sandbox.enabled ((index .Values.apps "xyne-claw").enabled | default false)) "health" $ing.edgeTerminated)
  "storageClass" (dict "enabled" (not (empty (include "xyne-root.awsDefault" (dict "root" $ "value" $sc.enabled)))))
}}
{{- $values := include "xyne-root.merge" (dict "base" $base "layers" (list $pc.values)) | fromYaml }}
{{- if $istio.enabled }}
{{- include "xyne-root.application" (dict "root" $ "name" "platform-config" "namespace" .Values.global.namespace "wave" -2 "source" (include "xyne-root.helmSource" (dict "root" $ "path" "deployment/argocd/addons/platform-config" "targetRevision" .Values.platformRevision "releaseName" "platform-config" "values" $values) | fromYaml)) }}
{{- end }}
