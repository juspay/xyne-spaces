{{- $repl := index .Values.apps "xyne-zero-replication" | default dict }}
{{- if $repl.enabled }}
{{- include "xyne-root.app" (dict "root" $ "name" "xyne-zero-replication" "chart" "xyne-zero" "builder" "xyne-zero-replication" "wave" ($repl.wave | default 0)) }}
{{- end }}
{{- $charts := list "xyne-backend" "xyne-dashboard" "xyne-dashboard-external" "xyne-dashboard-edge" "xyne-ysweet" "xyne-claw" "xyne-claw-auth" "xyne-claw-auth-frontend" "xyne-transcription-agent" "xyne-lighton-ocr" }}
{{- range $chart := $charts }}
{{- $app := index $.Values.apps $chart | default dict }}
{{- if $app.enabled }}
{{- include "xyne-root.app" (dict "root" $ "name" $chart "chart" $chart "wave" ($app.wave | default 1)) }}
{{- end }}
{{- end }}
{{- range $w := .Values.apps.workers }}
{{- include "xyne-root.app" (dict "root" $ "name" (printf "xyne-worker-%s" $w.name) "chart" "xyne-worker" "wave" ($w.wave | default 1) "worker" $w "workerValues" $w.values) }}
{{- end }}
{{- $zero := index .Values.apps "xyne-zero" | default dict }}
{{- if $zero.enabled }}
{{- include "xyne-root.app" (dict "root" $ "name" "xyne-zero" "chart" "xyne-zero" "wave" ($zero.wave | default 2)) }}
{{- end }}
