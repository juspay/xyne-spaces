{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.claw.name }}-sandboxclaims
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
rules:
  # Create and delete only: a claim is never edited after it is created. Its signed repo
  # list (annotation xyne.ai/git-scope) is what git-gateway enforces, so the runtime must
  # not be able to replace it on a running sandbox.
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.claw.name }}-sandboxclaims
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.claw.name }}-sandboxclaims
subjects:
  - kind: ServiceAccount
    name: {{ .Values.claw.serviceAccount }}
    namespace: {{ .Values.namespace }}
{{- end }}
