domain: spaces.example.com
namespace: xyne

gateway:
  enabled: true
  namespace: istio-ingress
  name: xyne-gateway
  selector:
    istio: ingressgateway
  tlsSecret: xyne-gateway-tls
  httpsRedirect: true
  edgeTerminated: false
  tls: acme
  extraHosts: []

certManager:
  enabled: true
  mode: acme
  email: ""
  issuer: letsencrypt
  server: https://acme-v02.api.letsencrypt.org/directory
  wildcard: false
  ingressClassName: istio
  duration: 8760h
  renewBefore: 720h

peerAuthentication:
  enabled: true
  mode: STRICT

storageClass:
  enabled: false
  name: gp3
  provisioner: ebs.csi.aws.com
  parameters:
    type: gp3
  default: true
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Delete

argocd:
  enabled: false
  host: ""
  namespace: argocd
  service: argocd-server
  port: 80

workflows:
  enabled: false
  host: ""
  namespace: argo-workflows
  service: argo-workflows-server
  port: 2746

routes:
  externalDashboard: false
  clawAuth: false
  clawAuthFrontend: false
  clawPreview: false
  apiTimeout: 50s
  health: false
  healthPath: /healthz/ready
  extra: []

services:
  backend:
    host: xyne-backend
    port: 80
  # The /zero/ client endpoint is served by xyne-sync (streamgres), which
  # replaced the Zero view-syncer on this deployment. Zero keeps a 40GB local
  # SQLite replica and died repeatedly on heap exhaustion; streamgres follows a
  # Postgres logical replication slot instead and holds no replica. It
  # impersonates Zero on purpose (APP_ID zero, shard 0, BASE_PATH /zero, port
  # 4848) so no client change was needed.
  #
  # rewrite false because streamgres is mounted at /zero and must receive the
  # prefix. Point host back at xyne-zero and set rewrite true to roll back.
  zero:
    host: xyne-sync
    port: 80
    rewrite: false
  ysweet:
    host: xyne-ysweet
    port: 8080
  externalDashboard:
    host: xyne-dashboard-external
    port: 80
  clawAuth:
    host: xyne-claw-auth
    port: 3003
  clawAuthFrontend:
    host: xyne-claw-auth-frontend
    port: 80
  sandboxRouter:
    host: xyne-sandbox-router
    port: 8080
  dashboard:
    host: xyne-dashboard
    port: 80
