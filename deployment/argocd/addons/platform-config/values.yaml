domain: spaces.example.com
namespace: xyne

gateway:
  enabled: true
  namespace: istio-ingress
  name: xyne-gateway
  selector:
    istio: ingressgateway
  tlsSecret: xyne-gateway-tls
  httpsRedirect: true
  edgeTerminated: false
  tls: acme
  extraHosts: []

certManager:
  enabled: true
  mode: acme
  email: ""
  issuer: letsencrypt
  server: https://acme-v02.api.letsencrypt.org/directory
  wildcard: false
  ingressClassName: istio
  duration: 8760h
  renewBefore: 720h

peerAuthentication:
  enabled: true
  mode: STRICT

storageClass:
  enabled: false
  name: gp3
  provisioner: ebs.csi.aws.com
  parameters:
    type: gp3
  default: true
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Delete

argocd:
  enabled: false
  host: ""
  namespace: argocd
  service: argocd-server
  port: 80

workflows:
  enabled: false
  host: ""
  namespace: argo-workflows
  service: argo-workflows-server
  port: 2746

routes:
  externalDashboard: false
  clawAuth: false
  clawAuthFrontend: false
  clawPreview: false
  apiTimeout: 50s
  # Total-duration cap for the Xyne AI SSE routes (POST /api/xyne-ai and the
  # /live re-attach stream). Empty disables the dedicated route.
  streamTimeout: 15m
  health: false
  healthPath: /healthz/ready
  extra: []

services:
  backend:
    host: xyne-backend
    port: 80
  zero:
    host: xyne-zero
    port: 80
  ysweet:
    host: xyne-ysweet
    port: 8080
  externalDashboard:
    host: xyne-dashboard-external
    port: 80
  clawAuth:
    host: xyne-claw-auth
    port: 3003
  clawAuthFrontend:
    host: xyne-claw-auth-frontend
    port: 80
  sandboxRouter:
    host: xyne-sandbox-router
    port: 8080
  dashboard:
    host: xyne-dashboard
    port: 80
