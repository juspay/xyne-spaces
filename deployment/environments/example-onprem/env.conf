CLOUD=onprem
STATE_BUCKET=example-tfstate
STATE_ENDPOINT=https://s3.example.internal:7442
STATE_REGION=default
STATE_PREFIX=xyne
KUBECONFIG_PATH=/absolute/path/to/kubeconfig.yaml
KUBE_CONTEXT=
# PEM that signed the object store's certificate. Set this when the store uses a
# private CA. On macOS it is also required whenever that certificate is valid for
# more than 398 days: Go defers to Apple's verifier unless given an explicit root
# pool, and Apple rejects longer-lived server certificates outright with
# "certificate is not standards compliant".
STATE_CA_BUNDLE=
# The aws CLI is Python. Set this to 1 if it rejects the certificate for a reason
# the bundle cannot fix, such as a CA with no keyUsage extension. It takes
# precedence over STATE_CA_BUNDLE, so terraform can still verify properly.
STATE_INSECURE=0
