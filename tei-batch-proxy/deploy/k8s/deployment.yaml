apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-batch-proxy
  namespace: xyne-vespa
  labels:
    app: tei-batch-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei-batch-proxy
  template:
    metadata:
      labels:
        app: tei-batch-proxy
    spec:
      containers:
        - name: tei-batch-proxy
          image: <REGISTRY>/tei-batch-proxy:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Point at the EXISTING TEI embedder service (BAAI/bge-base-en-v1.5, 768-dim).
            # Same model/dimension as today -> NO re-index needed.
            - { name: UPSTREAM_EMBEDDINGS_URL,   value: "http://vespa-embedder.xyne-vespa.svc.cluster.local/v1/embeddings" }
            - { name: PORT,                      value: "8080" }
            - { name: EMBEDDINGS_BATCH_SIZE,     value: "512" }   # < TEI --max-client-batch-size (1000)
            - { name: UPSTREAM_CONCURRENCY,      value: "1" }
            - { name: REQUEST_TIMEOUT_MS,        value: "1800000" }
            - { name: MAX_RETRIES,               value: "8" }
            - { name: RETRY_BASE_MS,             value: "1000" }
            - { name: PROXY_PAYLOAD_LIMIT_BYTES, value: "200000000" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
