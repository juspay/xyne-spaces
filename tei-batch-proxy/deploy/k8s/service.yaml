apiVersion: v1
kind: Service
metadata:
  name: tei-batch-proxy
  namespace: xyne-vespa
  labels:
    app: tei-batch-proxy
spec:
  selector:
    app: tei-batch-proxy
  ports:
    # Port 80 (like vespa-embedder) -> container 8080, so Vespa's embedder endpoint is:
    #   http://tei-batch-proxy.xyne-vespa.svc.cluster.local/v1/embeddings
    - name: http
      port: 80
      targetPort: 8080
