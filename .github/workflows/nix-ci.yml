name: Nix CI

# Guards the Nix-based local dev setup (the flake devShell + the process-compose
# services bundle) against regressions. Three classes are covered:
#   1. flake eval / build breakage (removed attrs, broken derivations, input drift)
#   2. source-path drift in the process-compose bootstrap (project.nix) — the class
#      that silently broke db-setup when the repo was restructured to apps/backend/.
#   3. runtime startup: Prisma engines/clients, native Python libraries, LiveKit
#      Redis connectivity, database bootstrap, and the backend health endpoint.
#
# Installer + cache choice follows juspay/skills `nix-ci` (Option 1, GitHub
# Actions): use nix-quick-install-action (NOT the DeterminateSystems installer),
# because only its store layout is snapshotted by cache-nix-action.

# Enabled on pull requests and protected-branch pushes. The `nix` job runs on
# GitHub-hosted runners unless vars.USE_SELF_HOSTED_CI is true, in which case it
# moves to the self-hosted Nix pool and skips the installer + actions cache (the
# runner image supplies both). Installer choice on GitHub-hosted runners follows
# juspay/skills `nix-ci` (Option 1): nix-quick-install-action, NOT the
# DeterminateSystems installer, because only its store layout is snapshotted by
# cache-nix-action.
on:
  workflow_dispatch:
    inputs:
      # One-off publish. `main` always pushes :latest; any other ref with
      # `publish: true` pushes :sha-<7-char sha> only, never :latest.
      publish:
        description: Push the dev image to GHCR (non-main refs push :sha-<short>)
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
      - master
      - staging
      - "release**"
      - "fix/nix-**"

permissions:
  contents: read
  # Required by cache-nix-action `purge: true` — it calls the REST cache API to
  # evict stale entries. Without it the save aborts and nothing is ever cached.
  actions: write
  # Required by the `image` job to push ghcr.io/juspay/xyne-spaces-dev.
  packages: write

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Cancel superseded PR runs; never cancel a protected-branch push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    name: Nix build + runtime smoke test
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-nix' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        if: vars.USE_SELF_HOSTED_CI != 'true'
        with:
          nix_conf: |
            substituters = https://cache.nixos.org https://cache.nixos.asia/oss
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=
            accept-flake-config = true

      # Cache /nix/store across runs — a cold closure for this stack is minutes;
      # a warm restore is ~1 min. Keyed on the Nix inputs so it invalidates when
      # the flake, project.nix, or nix/ tree changes.
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        if: vars.USE_SELF_HOSTED_CI != 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/flake.nix', 'project.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 604800
          purge-primary-key: never

      # Push every store path this job realises to the shared OSS Attic cache
      # (https://cache.nixos.asia/oss). The action's post hook does the push —
      # there is no explicit push step. Works on both runner flavours.
      - uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: https://cache.nixos.asia
          cache: oss
          token: ${{ secrets.ATTIC_TOKEN }}

      # 1. Evaluate outputs and build source guards and script tests.
      - name: nix flake check
        run: nix flake check -L

      # 2. Build what a developer actually consumes: the dev shell and the
      #    process-compose services bundle. Catches broken/removed derivations.
      - name: nix build (devShell + services bundle)
        run: nix build -L .#devShells.x86_64-linux.default .#xyne-space-services

      - name: Prepare workspace through the Nix development shell
        run: nix develop --command just prepare

      - name: Check local secrets and development proxy configuration
        run: nix develop --command node --test scripts/generate-local-secrets.test.mjs scripts/dashboard-dev-proxy.test.mjs

      # Uses the exact generated process commands, without the launcher's port
      # cleanup. A fresh runner cannot accidentally pass using an existing service.
      - name: Start native services and verify backend health
        run: nix run .#nix-smoke-test

      - name: Upload smoke test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-smoke-logs
          path: .logs/
          include-hidden-files: true
          retention-days: 7

  # Phase 1: the same Nix stack as one `docker run`, for contributors without
  # Nix. One job per arch; each runs the smoke test inside its container so the
  # image cannot drift from the flake.
  image:
    name: Build, run and publish the dev image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            substituters = https://cache.nixos.org https://cache.nixos.asia/juspay
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= juspay:5aHaNForWL03wKOGhUn/al4BZd3HqZDWZ3hrVTcf6Fg=
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          # Per-arch keys: the two runners share no store paths.
          primary-key: nix-image-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('flake.lock', '**/flake.nix', 'project.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-image-${{ runner.os }}-${{ matrix.arch }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-image-${{ runner.os }}-${{ matrix.arch }}-
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: Build the dev image
        run: nix build -L .#packages.${{ matrix.system }}.dev-image

      - name: Load the image
        run: ./result | docker load

      # The image runs as uid 1000; the runner owns the checkout as uid 1001.
      - name: Hand the mounted checkout to the container user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Run the image against the checkout
        run: |
          docker run -d --name xyne-dev \
            -v "$GITHUB_WORKSPACE":/src \
            -p 3000:3000 -p 3001:3001 \
            ghcr.io/juspay/xyne-spaces-dev:latest

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' xyne-dev)" != "true" ]; then
              echo "Container exited before becoming healthy" >&2
              docker logs xyne-dev >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then
              echo "Backend healthy after $attempt attempts"
              exit 0
            fi
            sleep 5
          done
          echo "Backend never became healthy" >&2
          docker logs xyne-dev >&2
          exit 1

      - name: Run the smoke test inside the container
        run: docker exec xyne-dev nix-smoke-test --existing-services

      # The cache action's post step hashes the workspace as the runner user.
      - name: Hand the checkout back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Container and smoke test logs
        if: always()
        run: |
          docker logs xyne-dev || true
          docker exec xyne-dev sh -c 'cat .logs/nix-smoke/*.log' 2>/dev/null || true

      - name: Publish ghcr.io/juspay/xyne-spaces-dev
        if: github.ref == 'refs/heads/main' || inputs.publish == true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag=latest
          else
            # Non-main refs never touch :latest.
            tag="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          # Per-arch image; the `manifest` job ties the two together.
          docker tag ghcr.io/juspay/xyne-spaces-dev:latest "ghcr.io/juspay/xyne-spaces-dev:$tag-$ARCH"
          docker push "ghcr.io/juspay/xyne-spaces-dev:$tag-$ARCH"

  # One manifest over the per-arch images, so `docker run` picks the host's arch.
  manifest:
    name: Publish the multi-arch manifest
    needs: image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || inputs.publish == true
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Create and inspect the manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag=latest
          else
            tag="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          docker buildx imagetools create -t "ghcr.io/juspay/xyne-spaces-dev:$tag" \
            "ghcr.io/juspay/xyne-spaces-dev:$tag-amd64" \
            "ghcr.io/juspay/xyne-spaces-dev:$tag-arm64"
          docker manifest inspect "ghcr.io/juspay/xyne-spaces-dev:$tag" > /tmp/manifest.json
          cat /tmp/manifest.json
          echo "platforms:"
          jq -r '.manifests[].platform | "  \(.os)/\(.architecture)"' /tmp/manifest.json
