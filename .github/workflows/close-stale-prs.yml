name: Close Stale PRs

# Manual only (Actions tab -> Run workflow): closes open PRs with no commits in
# the last 30 days (a comment is left explaining why; closed PRs can be
# reopened). dry_run is on by default: it lists what would be closed without
# closing anything. Untick it to close for real.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List stale PRs without closing them"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: close-stale-prs
  cancel-in-progress: false

jobs:
  close-stale-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Close stale PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_DAYS: "30"
          DRY_RUN: ${{ inputs.dry_run }}
        run: .github/scripts/close-stale-prs.sh
