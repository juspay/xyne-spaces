name: Test Self-Hosted Runner

on:
  push:
    branches:
      - fix/test-local-runner
      - feature/self-hosted-runner-test
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Print hostname
        run: hostname

      - name: Print current user
        run: whoami

      - name: Print OS
        run: uname -a

      - name: Success message
        run: echo "Self-hosted runner is working successfully!"
