name: RCA-check

# Fix PRs must carry a Root Cause Analysis in the description. This job reads the
# PR body and fails when a required RCA heading is missing or empty.
#
# Two details matter if this is made a required status check:
#   * `types: [edited]` — otherwise fixing the description never clears the red check.
#   * `merge_group` — a body-based check cannot report on a merge queue entry, so the
#     job short-circuits there instead of leaving the queue blocked forever.

on:
  pull_request:
    types:
      [
        opened,
        edited,
        reopened,
        synchronize,
        ready_for_review,
        labeled,
        unlabeled,
      ]
  merge_group:

permissions:
  contents: read

jobs:
  rca:
    name: rca
    runs-on: ubuntu-latest
    steps:
      - name: Validate RCA section
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr     = context.payload.pull_request;
            const body   = pr.body || '';
            const title  = pr.title || '';
            const head   = pr.head.ref || '';
            const labels = (pr.labels || []).map(l => l.name.toLowerCase());

            const isFix =
              head.startsWith('fix/') ||
              /^fix(\(|:)/i.test(title) ||
              /^\s*-\s*\[x\]\s*Bugfix/im.test(body) ||
              labels.includes('bug') ||
              labels.includes('bugfix');

            if (!isFix) {
              core.info('Not a fix PR — RCA not required.');
              return;
            }

            if (labels.includes('rca-exempt')) {
              core.warning('rca-exempt label present — skipping RCA validation.');
              return;
            }

            const required = ['Root Cause', 'Missed Scenario', 'Impact', 'Fix', 'Prevention'];
            // Drop template comments so an untouched template does not count as filled in.
            const stripped = body.replace(/<!--[\s\S]*?-->/g, '');
            const missing = [];

            for (const heading of required) {
              const re = new RegExp(
                `^#{2,4}\\s*${heading}\\s*$([\\s\\S]*?)(?=^#{2,4}\\s|$(?![\\s\\S]))`,
                'im',
              );
              const match = stripped.match(re);
              const content = (match?.[1] || '').replace(/[-*\s>]/g, '');
              if (content.length < 10) missing.push(heading);
            }

            if (missing.length) {
              core.setFailed(
                'This is a fix PR, so the RCA section is mandatory. ' +
                `Missing or empty: ${missing.join(', ')}. ` +
                'Fill them in the PR description — this check re-runs on every edit.',
              );
            } else {
              core.info('RCA section present.');
            }
