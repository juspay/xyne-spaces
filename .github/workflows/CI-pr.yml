name: CI-pr

# Runs the full CI suite (ci.yml) on every pull request and on merge queue
# entries (merge_group) — the queue's required checks come from this workflow.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

# Cancel superseded runs on ordinary feature branches when a new commit is
# pushed. Do NOT cancel for protected branches (main/master/staging/release*)
# so their builds always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.head_ref != 'main'
        && github.head_ref != 'master'
        && github.head_ref != 'staging'
        && !startsWith(github.head_ref, 'release') }}

jobs:
  ci:
    uses: juspay/xyne-spaces/.github/workflows/ci.yml@main
    permissions:
      contents: read
