name: CI

# Reusable workflow: the actual build/lint/secret-scan jobs live here and are
# called by CI-pr.yml (pull requests) and CI-push.yml (protected branches).
# Concurrency/cancellation policy is defined by the callers, not here.
on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # --prod=false: the runner env can set NODE_ENV=production, which would skip
  #   the devDependencies (typescript, react, @types/*) these builds need.
  # Each job installs only its own package plus that package's workspace
  # dependencies (the `...` filter suffix), so jobs stay independent and cheap.
  PNPM_FLAGS: "--frozen-lockfile --prod=false"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: depends on @xyne/shared and agentic-framework, which are workspace
  # packages consumed from their built dist/ — so they are compiled first.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend typecheck + build
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-mini' || 'ubuntu-latest' }}
    # tsc over backend's type surface (incl. generated Prisma/Zero schemas)
    # exceeds Node's ~2GB default heap on the runner.
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      # Early exit: skip every step below when nothing this job builds changed
      # (pull requests, and mobile-only merge queue entries; push always runs).
      # The action is pinned to main so a PR cannot edit it to skip its own checks.
      - name: Check if affected
        id: affected
        uses: juspay/xyne-spaces/.github/actions/ci-affected@main
        with:
          package: xyne-spaces-backend
          extra-paths: apps/backend/eslint-rules scripts/validate-zero-column-parity.mjs

      - uses: actions/setup-node@v5
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # TEST: npm mirror via Artifact Registry pull-through cache, scoped to
      # this job only while validating — see npm-mirror in xyne-infra-external.
      # Static SA key (not Workload Identity): the GKE_METADATA interception
      # that WI needs doesn't work reliably with this cluster's Calico CNI.
      # Only pull through the mirror on self-hosted — on ubuntu-latest the
      # public registry is already fast and this secret/step is unneeded.
      - name: Authenticate to GCP (npm mirror)
        id: gcp-auth
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NPM_MIRROR_SA_KEY }}
          token_format: access_token

      - name: Configure pnpm for Artifact Registry npm mirror
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        run: |
          pnpm config set registry "https://asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/"
          echo "//asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/:_authToken=${{ steps.gcp-auth.outputs.access_token }}" >> .npmrc

      # TEST: higher network concurrency against our own mirror (same
      # region, low-latency, under our control) — default 16 is tuned for
      # arbitrary public registries, overly conservative here. Only applied
      # on self-hosted/mirror, not against the public registry on
      # ubuntu-latest — don't want to hammer npmjs.org with 64 concurrent
      # requests.
      - name: Install dependencies
        if: steps.affected.outputs.run == 'true'
        run: >-
          pnpm install ${{ env.PNPM_FLAGS }}
          ${{ vars.USE_SELF_HOSTED_CI == 'true' && '--network-concurrency 64' || '' }}
          --filter xyne-spaces-backend...

      - name: Build workspace libraries
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter agentic-framework run build

      - name: Prisma generate (app + common schemas)
        if: steps.affected.outputs.run == 'true'
        run: |
          pnpm --filter xyne-spaces-backend run db:generate
          pnpm --filter xyne-spaces-backend run db:common:generate

      # The hand-maintained Zero client schema must not declare a column that
      # schema.prisma does not have (the drift that caused a runtime mismatch).
      - name: Validate Zero <> Prisma column parity
        if: steps.affected.outputs.run == 'true'
        run: node scripts/validate-zero-column-parity.mjs --ci-mode

      # backend lint intentionally omitted (~259 pre-existing errors — separate cleanup).
      - name: Typecheck + build
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter xyne-spaces-backend run build

  # ---------------------------------------------------------------------------
  # Dashboard: depends on @xyne/shared and @xyne/icons, consumed from dist/.
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard
    # TEST: merged from 3 matrix legs (lint/typecheck/build) into one job.
    # Each leg used to run its own Install dependencies in parallel — 3
    # concurrent installs against the mirror per PR. Trades wall-clock time
    # on this job (steps now run sequentially, one pod) for far less
    # concurrent load on the shared mirror/node pool. Pinned to mini-max only
    # for this test, per request — not the usual self-hosted/ubuntu-latest
    # fallback ternary.
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-mini-max' || 'ubuntu-latest' }}
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      # Early exit: skip every step below when nothing this job builds changed
      # (pull requests, and mobile-only merge queue entries; push always runs).
      # The action is pinned to main so a PR cannot edit it to skip its own checks.
      - name: Check if affected
        id: affected
        uses: juspay/xyne-spaces/.github/actions/ci-affected@main
        with:
          package: xyne-spaces-dashboard

      - uses: actions/setup-node@v5
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # TEST: npm mirror via Artifact Registry pull-through cache — see the
      # same steps/comment on the backend job above.
      - name: Authenticate to GCP (npm mirror)
        id: gcp-auth
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NPM_MIRROR_SA_KEY }}
          token_format: access_token

      - name: Configure pnpm for Artifact Registry npm mirror
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        run: |
          pnpm config set registry "https://asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/"
          echo "//asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/:_authToken=${{ steps.gcp-auth.outputs.access_token }}" >> .npmrc

      # TEST: higher network concurrency against our own mirror — see the same
      # comment on the backend job above.
      - name: Install dependencies
        if: steps.affected.outputs.run == 'true'
        run: >-
          pnpm install ${{ env.PNPM_FLAGS }}
          ${{ vars.USE_SELF_HOSTED_CI == 'true' && '--network-concurrency 64' || '' }}
          --filter xyne-spaces-dashboard...

      # No "Build workspace libraries" step needed here (unlike backend):
      # @xyne/shared AND @xyne/icons both have their own `prepare: pnpm run
      # build` hooks, so pnpm already builds both automatically during
      # `Install dependencies` above. Backend still needs the step because
      # agentic-framework has no prepare script of its own.

      # errors-only (warnings ignored).
      - name: Lint (errors only)
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter xyne-spaces-dashboard run lint:errors-only:ci

      - name: Format check
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter xyne-spaces-dashboard run format:check

      - name: Restore tsc incremental state
        if: steps.affected.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: apps/dashboard/node_modules/.tmp/tsconfig.app.tsbuildinfo
          key: dashboard-tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dashboard-tsbuildinfo-${{ runner.os }}-

      - name: Typecheck
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter xyne-spaces-dashboard run typecheck

      - name: Build
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter xyne-spaces-dashboard run build

  test:
    name: Automation tests
    # Runs on every PR; RUN_TEST_CASE is the kill switch.
    if: vars.RUN_TEST_CASE == 'true'
    runs-on: ci-cluster-github-runners
    env:
      TEST_ENV: test
      BROWSER: chromium
      # Gauge workers; forwarded into the automation container by the runner.
      PARALLEL: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      # Skips the suite only when a PR or merge queue entry touches nothing but
      # mobile and standalone claw code (neither is in the test stack); any other
      # change runs it, including claw code inside backend/dashboard.
      - name: Check if affected
        id: affected
        uses: juspay/xyne-spaces/.github/actions/ci-affected@main
        with:
          package: xyne-automation
          ignore-paths: >-
            apps/mobile/
            apps/xyne-claw/
            apps/xyne-claw-auth/
            packages/xyne-claw-shared/
            packages/xyne-claw-mcp/
            packages/xyne-claw-pi-plugin/
            claw-deployments/
            helm-charts/charts/xyne-claw/
            helm-charts/charts/xyne-claw-auth/
            helm-charts/charts/xyne-claw-auth-frontend/

      - uses: actions/setup-node@v5
        if: steps.affected.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # No host-side `playwright install`: Gauge runs inside the xyne-automation
      # container (mcr.microsoft.com/playwright base image, Chromium pre-baked),
      # and the runner's egress proxy blocks cdn.playwright.dev anyway.
      - name: Install dependencies
        if: steps.affected.outputs.run == 'true'
        run: pnpm install ${{ env.PNPM_FLAGS }} --filter xyne-automation...

      - name: Run automation tests
        if: steps.affected.outputs.run == 'true'
        run: pnpm run test

      - name: Show container states and logs
        if: always() && steps.affected.outputs.run == 'true'
        run: |
          find tools/xyne-automation/reports -type f \( -name '*.log' -o -name '*.txt' \) | sort | while read -r f; do
            echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"
          done

      - name: Push report to Spaces
        if: always() && steps.affected.outputs.run == 'true'
        env:
          JWT: ${{ secrets.TESTCASES_JWT }}
          CHANNELID: ${{ secrets.TESTCASES_CHANNELID }}
          SPACES_URL: ${{ secrets.SPACES_URL }}
        run: |
          set -euo pipefail
          # Secrets are empty on fork PRs; don't turn a green test job red over the upload.
          if [ -z "${JWT:-}" ] || [ -z "${CHANNELID:-}" ] || [ -z "${SPACES_URL:-}" ]; then
            echo "::notice::Spaces upload secrets not available — skipping report push"
            exit 0
          fi

          RUN_DIR=$(find tools/xyne-automation/reports -maxdepth 1 -mindepth 1 -type d -name '*-runner' -printf '%T@ %p\n' \
            | sort -n | tail -n1 | cut -d' ' -f2-)
          REPORT_DIR=$(find tools/xyne-automation/reports -type d -name html-report -printf '%T@ %p\n' \
            | sort -n | tail -n1 | cut -d' ' -f2-)
          DOCKER_LOGS_DIR=$(find tools/xyne-automation/reports -maxdepth 2 -type d -name docker-logs -printf '%T@ %p\n' \
            | sort -n | tail -n1 | cut -d' ' -f2-)

          UPLOAD_ARGS=()
          # One-click view: a self-contained summary page (failures + screenshots, passes collapsed)
          # built from Gauge's json-report. Uploaded first so it's the first thing in the message.
          if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/json-report/result.json" ]; then
            tools/xyne-automation/node_modules/.bin/ts-node --project tools/xyne-automation/tsconfig.json \
              tools/xyne-automation/scripts/build-summary-report.ts "$RUN_DIR" "$RUNNER_TEMP/automation-report.html"
            UPLOAD_ARGS+=(-F "files=@$RUNNER_TEMP/automation-report.html;type=text/html")
          fi
          # Full detail: the endpoint accepts at most 10 files, and Gauge's html-report needs its
          # css/fonts/images siblings to render — ship each directory as one archive.
          if [ -n "$DOCKER_LOGS_DIR" ]; then
            tar -czf "$RUNNER_TEMP/docker-logs.tgz" -C "$DOCKER_LOGS_DIR" .
            UPLOAD_ARGS+=(-F "files=@$RUNNER_TEMP/docker-logs.tgz;type=application/gzip")
          fi
          if [ -n "$REPORT_DIR" ]; then
            tar -czf "$RUNNER_TEMP/html-report.tgz" -C "$REPORT_DIR" .
            UPLOAD_ARGS+=(-F "files=@$RUNNER_TEMP/html-report.tgz;type=application/gzip")
          fi

          if [ ${#UPLOAD_ARGS[@]} -eq 0 ]; then
            echo "::error::Nothing to push — no html-report and no docker-logs found"
            exit 1
          fi

          # Success is a FILE_UPLOADED event; a rejected upload comes back 2xx with {"success":false,...}.
          RESPONSE=$(curl -sS --fail-with-body -X POST "${SPACES_URL%/}/api/apps/files/filesUpload" \
            -H "Authorization: Bearer $JWT" \
            -F "channelId=$CHANNELID" \
            -F "markdownText=CI automation test report — commit ${GITHUB_SHA::9}" \
            "${UPLOAD_ARGS[@]}") || { echo "$RESPONSE"; echo "::error::Report push failed"; exit 1; }
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":false'; then
            echo "::error::Report push rejected"; exit 1
          fi

  # Framework lint — self-contained (no workspace deps).
  framework-lint:
    name: Framework lint
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-mini' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      # Early exit: skip every step below when nothing this job builds changed
      # (pull requests, and mobile-only merge queue entries; push always runs).
      # The action is pinned to main so a PR cannot edit it to skip its own checks.
      - name: Check if affected
        id: affected
        uses: juspay/xyne-spaces/.github/actions/ci-affected@main
        with:
          package: agentic-framework

      - uses: actions/setup-node@v5
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # npm mirror via Artifact Registry pull-through cache — see the same
      # steps/comment on the backend job above.
      - name: Authenticate to GCP (npm mirror)
        id: gcp-auth
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NPM_MIRROR_SA_KEY }}
          token_format: access_token

      - name: Configure pnpm for Artifact Registry npm mirror
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        run: |
          pnpm config set registry "https://asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/"
          echo "//asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/:_authToken=${{ steps.gcp-auth.outputs.access_token }}" >> .npmrc

      - name: Install dependencies
        if: steps.affected.outputs.run == 'true'
        run: pnpm install ${{ env.PNPM_FLAGS }} --filter agentic-framework...

      - name: Lint
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter agentic-framework run lint

  # ---------------------------------------------------------------------------
  # xyne-claw stack: kata-sdk -> xyne-claw-shared -> xyne-claw (typecheck only;
  # these expose typecheck but no build script). One filtered install pulls the
  # whole chain in, replacing the old three-step sequential npm ci.
  # ---------------------------------------------------------------------------
  xyne-claw:
    name: xyne-claw typecheck
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-mini' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      # Early exit: skip every step below when nothing this job builds changed
      # (pull requests, and mobile-only merge queue entries; push always runs).
      # The action is pinned to main so a PR cannot edit it to skip its own checks.
      - name: Check if affected
        id: affected
        uses: juspay/xyne-spaces/.github/actions/ci-affected@main
        with:
          package: xyne-claw

      - uses: actions/setup-node@v5
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Authenticate to GCP (npm mirror)
        id: gcp-auth
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NPM_MIRROR_SA_KEY }}
          token_format: access_token

      - name: Configure pnpm for Artifact Registry npm mirror
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        run: |
          pnpm config set registry "https://asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/"
          echo "//asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/:_authToken=${{ steps.gcp-auth.outputs.access_token }}" >> .npmrc

      - name: Install dependencies
        if: steps.affected.outputs.run == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: >-
          pnpm install ${{ env.PNPM_FLAGS }}
          ${{ vars.USE_SELF_HOSTED_CI == 'true' && '--network-concurrency 64' || '' }}
          --filter xyne-claw...

      - name: Typecheck xyne-claw-shared
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter xyne-claw-shared run typecheck

      - name: Typecheck xyne-claw
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter xyne-claw run typecheck

  # apps/mobile has its own lockfile; @xyne/shared is linked, so build it first.
  mobile:
    name: Mobile checks
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-mini' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # apps/mobile is outside the root workspace, so it is matched by path.
      - name: Check if affected
        id: affected
        uses: juspay/xyne-spaces/.github/actions/ci-affected@main
        with:
          package: "@xyne/shared"
          extra-paths: apps/mobile

      - uses: actions/setup-node@v5
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/mobile/pnpm-lock.yaml

      - name: Authenticate to GCP (npm mirror)
        id: gcp-auth
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.NPM_MIRROR_SA_KEY }}
          token_format: access_token

      # User-level config: apps/mobile is its own workspace and ignores the root .npmrc.
      - name: Configure pnpm for Artifact Registry npm mirror
        if: steps.affected.outputs.run == 'true' && vars.USE_SELF_HOSTED_CI == 'true'
        run: |
          pnpm config set registry "https://asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/"
          pnpm config set "//asia-south1-npm.pkg.dev/xyne-infra-external/npm-mirror/:_authToken" "${{ steps.gcp-auth.outputs.access_token }}"

      - name: Install + build @xyne/shared
        if: steps.affected.outputs.run == 'true'
        run: >-
          pnpm install ${{ env.PNPM_FLAGS }}
          ${{ vars.USE_SELF_HOSTED_CI == 'true' && '--network-concurrency 64' || '' }}
          --filter @xyne/shared...

      - name: Install dependencies
        if: steps.affected.outputs.run == 'true'
        run: >-
          pnpm install ${{ env.PNPM_FLAGS }}
          ${{ vars.USE_SELF_HOSTED_CI == 'true' && '--network-concurrency 64' || '' }}
          --dir apps/mobile

      - name: Typecheck
        if: steps.affected.outputs.run == 'true'
        run: pnpm --dir apps/mobile run typecheck

      - name: Lint (errors only)
        if: steps.affected.outputs.run == 'true'
        run: pnpm --dir apps/mobile run lint:errors-only

      - name: Format check
        if: steps.affected.outputs.run == 'true'
        run: pnpm --dir apps/mobile run format:check

      - name: Tests
        if: steps.affected.outputs.run == 'true'
        run: pnpm --dir apps/mobile run test

  # ---------------------------------------------------------------------------
  # Secret scan (gitleaks). Scans the working tree with the committed
  # .gitleaks.toml allowlist, mirroring the Jenkins gitleaksScan() step.
  # Pinned to the same version Jenkins uses. `dir` scans files (not git
  # history), so a shallow checkout is fine.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-mini' || 'ubuntu-latest' }}
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # The self-hosted runners differ in OS, so the release asset has to
          # follow whichever machine picked the job up.
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            macOS) os=darwin ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::Unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
          esac

          mkdir -p "$RUNNER_TEMP/bin"
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Run gitleaks
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # ---------------------------------------------------------------------------
  # Vulnerability + IaC scan (Trivy). Mirrors the Jenkins "Security Scan" source
  # stage (trivyScanSource) and scripts/run-trivy-local.sh: SOURCE TREE (fs) only
  # — dependency lockfiles + misconfig. Container image scanning is intentionally
  # not done here (removed from Jenkins too; it mostly surfaced base-image CVEs).
  # Secrets are handled by the gitleaks job above, not Trivy.
  #
  # Two-step scan: (1) full JSON report (never fails, archived as an artifact),
  # (2) gate on CRITICAL — matching the Jenkins gate (Jenkinsfile: `trivy convert
  # --severity CRITICAL`). Pinned to the same TRIVY_VERSION Jenkins uses.
  # ---------------------------------------------------------------------------
  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ${{ vars.USE_SELF_HOSTED_CI == 'true' && 'ci-cluster-github-runners-mini' || 'ubuntu-latest' }}
    env:
      TRIVY_VERSION: "0.72.0"
      # secrets handled by gitleaks; scan deps (vuln) + IaC (misconfig) only.
      TRIVY_SCANNERS: "vuln,misconfig"
    steps:
      - uses: actions/checkout@v5

      - name: Install Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b "$RUNNER_TEMP/bin" "v${TRIVY_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/trivy" --version

      # Trivy's default cache path is ~/.cache/trivy on Linux but
      # ~/Library/Caches/trivy on macOS. Pin it so the cached path below matches
      # on both self-hosted runners.
      - name: Pin Trivy cache path
        run: echo "TRIVY_CACHE_DIR=$HOME/.cache/trivy" >> "$GITHUB_ENV"

      # Vulnerability DB (~few hundred MB) changes ~every 6h; cache it per day so
      # reruns don't re-download. A cache miss just downloads fresh — never fatal.
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      # Scan ONCE to JSON, then render a table from that JSON. exit-code 0 here so
      # the full report is always produced and uploaded, independent of the gate.
      - name: Trivy source scan (report)
        run: |
          mkdir -p security-reports
          trivy fs --scanners "$TRIVY_SCANNERS" \
            --skip-dirs .securitybin --skip-dirs security-reports \
            --skip-dirs '**/node_modules' --skip-dirs '**/dist' \
            --format json -o security-reports/trivy-fs.json \
            --exit-code 0 --no-progress .
          trivy convert --format table security-reports/trivy-fs.json

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: security-reports/trivy-fs.json
          if-no-files-found: warn

      # Gate: fail the job on CRITICAL findings (mirrors the Jenkins gate). HIGH
      # and below are reported above but do not block. Reads the JSON from the
      # step above — no second scan.
      - name: Trivy gate (CRITICAL)
        run: trivy convert --severity CRITICAL --exit-code 1 security-reports/trivy-fs.json
