name: CI

# Reusable workflow: the actual build/lint/secret-scan jobs live here and are
# called by CI-pr.yml (pull requests) and CI-push.yml (protected branches).
# Concurrency/cancellation policy is defined by the callers, not here.
on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # --prod=false: the runner env can set NODE_ENV=production, which would skip
  #   the devDependencies (typescript, react, @types/*) these builds need.
  # Each job installs only its own package plus that package's workspace
  # dependencies (the `...` filter suffix), so jobs stay independent and cheap.
  PNPM_FLAGS: "--frozen-lockfile --prod=false"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: depends on @xyne/shared and agentic-framework, which are workspace
  # packages consumed from their built dist/ — so they are compiled first.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend typecheck + build
    runs-on: ubuntu-latest
    # tsc over backend's type surface (incl. generated Prisma/Zero schemas)
    # exceeds Node's ~2GB default heap on the runner.
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # node_modules cache. `cache: pnpm` above only caches the global pnpm
      # store (downloaded tarballs) — every run still re-links the store into
      # node_modules, the slow part with node-linker=isolated + 22 workspace
      # packages. Cache the linked tree too, keyed on the lockfile. With the
      # isolated linker the virtual store lives in the ROOT node_modules/.pnpm
      # and each package symlinks into it, so the root tree must be cached or the
      # symlinks dangle. On a hit `pnpm install` below is a near-instant no-op;
      # on a lockfile change it falls back to a normal install.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          # Exact lockfile match only (no restore-keys): never link a fresh
          # install on top of a stale tree from a different lockfile. A miss
          # just does a full install from the (cached) store.
          # Per-job suffix: each job runs a filtered install and thus produces a
          # DIFFERENT partial tree. Sharing one key made the jobs race for a
          # single cache slot (first to finish wins, rest skipped), so most jobs
          # restored a tree missing their packages. Namespacing by job gives each
          # its own complete cache.
          key: nm-${{ runner.os }}-backend-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_FLAGS }} --filter xyne-spaces-backend...

      - name: Build workspace libraries
        run: pnpm --filter @xyne/shared --filter agentic-framework run build

      - name: Prisma generate (app + common schemas)
        run: |
          pnpm --filter xyne-spaces-backend run db:generate
          pnpm --filter xyne-spaces-backend run db:common:generate

      # The hand-maintained Zero client schema must not declare a column that
      # schema.prisma does not have (the drift that caused a runtime mismatch).
      - name: Validate Zero <> Prisma column parity
        run: node scripts/validate-zero-column-parity.mjs --ci-mode

      # backend lint intentionally omitted (~259 pre-existing errors — separate cleanup).
      - name: Typecheck + build
        run: pnpm --filter xyne-spaces-backend run build

  # ---------------------------------------------------------------------------
  # Dashboard: depends on @xyne/shared and @xyne/icons, consumed from dist/.
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build]
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # See backend job for rationale: cache the linked node_modules tree (root
      # + per-package for the isolated linker), keyed exactly on the lockfile.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-dashboard-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_FLAGS }} --filter xyne-spaces-dashboard...

      - name: Build workspace libraries
        run: pnpm --filter @xyne/shared --filter @xyne/icons run build

      # --- lint leg ---------------------------------------------------------
      # errors-only (warnings ignored).
      - name: Lint (errors only)
        if: matrix.task == 'lint'
        run: pnpm --filter xyne-spaces-dashboard run lint:errors-only

      # --- typecheck leg ----------------------------------------------------
      - name: Format check
        if: matrix.task == 'typecheck'
        run: pnpm --filter xyne-spaces-dashboard run format:check

      - name: Restore tsc incremental state
        if: matrix.task == 'typecheck'
        uses: actions/cache@v4
        with:
          path: apps/dashboard/node_modules/.tmp/tsconfig.app.tsbuildinfo
          key: dashboard-tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dashboard-tsbuildinfo-${{ runner.os }}-

      - name: Typecheck
        if: matrix.task == 'typecheck'
        run: pnpm --filter xyne-spaces-dashboard run typecheck

      - name: Build
        if: matrix.task == 'build'
        run: pnpm --filter xyne-spaces-dashboard run build

  # Framework lint — self-contained (no workspace deps).
  framework-lint:
    name: Framework lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # See backend job for rationale: cache the linked node_modules tree (root
      # + per-package for the isolated linker), keyed exactly on the lockfile.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-agentic-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_FLAGS }} --filter agentic-framework...

      - name: Lint
        run: pnpm --filter agentic-framework run lint

  # ---------------------------------------------------------------------------
  # xyne-claw stack: kata-sdk -> xyne-claw-shared -> xyne-claw (typecheck only;
  # these expose typecheck but no build script). One filtered install pulls the
  # whole chain in, replacing the old three-step sequential npm ci.
  # ---------------------------------------------------------------------------
  xyne-claw:
    name: xyne-claw typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # See backend job for rationale: cache the linked node_modules tree (root
      # + per-package for the isolated linker), keyed exactly on the lockfile.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-claw-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_FLAGS }} --filter xyne-claw...

      - name: Typecheck xyne-claw-shared
        run: pnpm --filter xyne-claw-shared run typecheck

      - name: Typecheck xyne-claw
        run: pnpm --filter xyne-claw run typecheck

  # ---------------------------------------------------------------------------
  # Secret scan (gitleaks). Scans the working tree with the committed
  # .gitleaks.toml allowlist, mirroring the Jenkins gitleaksScan() step.
  # Pinned to the same version Jenkins uses. `dir` scans files (not git
  # history), so a shallow checkout is fine.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5

      # The gitleaks binary is version-pinned, so cache it per OS/arch/version
      # instead of re-downloading the release tarball on every run.
      - name: Cache gitleaks binary
        id: gl
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}

      - name: Install gitleaks
        if: steps.gl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The self-hosted runners differ in OS, so the release asset has to
          # follow whichever machine picked the job up.
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            macOS) os=darwin ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::Unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
          esac

          mkdir -p "$RUNNER_TEMP/bin"
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks

      # Runs on both hit and miss so PATH is set and the binary is verified
      # regardless of whether the install step above was skipped.
      - name: Add gitleaks to PATH
        run: |
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Run gitleaks
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # ---------------------------------------------------------------------------
  # Vulnerability + IaC scan (Trivy). Mirrors the Jenkins "Security Scan" source
  # stage (trivyScanSource) and scripts/run-trivy-local.sh: SOURCE TREE (fs) only
  # — dependency lockfiles + misconfig. Container image scanning is intentionally
  # not done here (removed from Jenkins too; it mostly surfaced base-image CVEs).
  # Secrets are handled by the gitleaks job above, not Trivy.
  #
  # Two-step scan: (1) full JSON report (never fails, archived as an artifact),
  # (2) gate on CRITICAL — matching the Jenkins gate (Jenkinsfile: `trivy convert
  # --severity CRITICAL`). Pinned to the same TRIVY_VERSION Jenkins uses.
  # ---------------------------------------------------------------------------
  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.72.0"
      # secrets handled by gitleaks; scan deps (vuln) + IaC (misconfig) only.
      TRIVY_SCANNERS: "vuln,misconfig"
    steps:
      - uses: actions/checkout@v5

      # The trivy binary is version-pinned, so cache it per OS/arch/version
      # instead of re-running the install script on every run.
      - name: Cache Trivy binary
        id: tv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin/trivy
          key: trivy-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.TRIVY_VERSION }}

      - name: Install Trivy
        if: steps.tv.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b "$RUNNER_TEMP/bin" "v${TRIVY_VERSION}"

      # Runs on both hit and miss so PATH is set and the binary is verified
      # regardless of whether the install step above was skipped.
      - name: Add Trivy to PATH
        run: |
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/trivy" --version

      # Trivy's default cache path is ~/.cache/trivy on Linux but
      # ~/Library/Caches/trivy on macOS. Pin it so the cached path below matches
      # on both self-hosted runners.
      - name: Pin Trivy cache path
        run: echo "TRIVY_CACHE_DIR=$HOME/.cache/trivy" >> "$GITHUB_ENV"

      # Vulnerability DB (~few hundred MB) refreshes ~every 6h. Bucket the cache
      # key on the same 6h cadence: every run inside a window is a true cache hit
      # (no download), and the first run of a new window pulls only the delta on
      # top of the previous window's DB (via restore-keys). The old
      # github.run_id key never matched — it re-fetched every run. Expressions
      # can't compute time, so the bucket (e.g. 2026-08-20-3) is built in a step.
      - name: Trivy DB cache bucket (6-hourly)
        id: tdb
        # 10# forces base-10: bash reads a leading-zero hour like 08/09 as
        # invalid octal in $(( )) otherwise, failing the step at 08:00/09:00 UTC.
        run: echo "key=$(date -u +%Y-%m-%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.tdb.outputs.key }}
          # Newest older DB when this window's cache doesn't exist yet, so Trivy
          # updates just the delta instead of a full download.
          restore-keys: |
            trivy-db-

      # Scan ONCE to JSON, then render a table from that JSON. exit-code 0 here so
      # the full report is always produced and uploaded, independent of the gate.
      - name: Trivy source scan (report)
        run: |
          mkdir -p security-reports
          trivy fs --scanners "$TRIVY_SCANNERS" \
            --skip-dirs .securitybin --skip-dirs security-reports \
            --skip-dirs '**/node_modules' --skip-dirs '**/dist' \
            --format json -o security-reports/trivy-fs.json \
            --exit-code 0 --no-progress .
          trivy convert --format table security-reports/trivy-fs.json

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: security-reports/trivy-fs.json
          if-no-files-found: warn

      # Gate: fail the job on CRITICAL findings (mirrors the Jenkins gate). HIGH
      # and below are reported above but do not block. Reads the JSON from the
      # step above — no second scan.
      - name: Trivy gate (CRITICAL)
        run: trivy convert --severity CRITICAL --exit-code 1 security-reports/trivy-fs.json
