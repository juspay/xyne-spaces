apiVersion: v1
kind: ServiceAccount
metadata:
  name: kata-deploy
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kata-deploy
rules:
  # Register kata RuntimeClasses (kata-fc, kata-qemu, kata-clh) after node install
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get", "create", "update", "delete", "list", "watch"]
  # Label nodes with katacontainers.io/kata-runtime=true after successful install
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kata-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kata-deploy
subjects:
- kind: ServiceAccount
  name: kata-deploy
  namespace: kube-system
