<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Meeting Detected</title>
  <style>
    html { font-size: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
      padding: 0.75rem 0.5rem 0.75rem 0.5rem;
    }

    /* ── Default popup ── */
    .popup {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border-radius: 0.875rem;
      box-shadow: 0 0 0.75rem rgba(0,0,0,0.18);
      padding: 0.875rem 1rem;
      opacity: 0;
      transform: translateY(-0.5rem);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .popup.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .popup.hiding {
      opacity: 0;
      transform: translateY(-0.5rem);
    }

    .btn-dismiss {
      position: absolute;
      top: -0.5rem;
      right: -0.5rem;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      border: 1px solid #e0e0e0;
      background: #fff;
      cursor: pointer;
      color: #666;
      font-size: 0.625rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    .btn-dismiss:hover { background: #f5f5f5; color: #333; }

    .icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; }

    .text { flex: 1; min-width: 0; }

    .title {
      font-weight: 600;
      font-size: 0.875rem;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #888;
      margin-top: 0.125rem;
      white-space: nowrap;
    }

    .btn-record {
      background: #000;
      color: #fff;
      border: none;
      border-radius: 1.25rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: inherit;
    }
    .btn-record:hover { background: #222; }

    /* ── Recording-started pill ── */
    .recording-pill {
      position: relative;
      display: none;
      align-items: center;
      gap: 0.875rem;
      background: #fff;
      border-radius: 2rem;
      box-shadow: 0 0 0.75rem rgba(0,0,0,0.18);
      padding: 0.5rem 1.75rem 0.5rem 1.125rem;
    }

    body.recording-mode .popup { display: none; }
    body.recording-mode .recording-pill { display: inline-flex; }

    /* Xyne icon with circular progress ring */
    .rec-icon-wrap {
      position: relative;
      width: 2.5rem;
      height: 2.5rem;
      flex-shrink: 0;
    }

    .rec-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      overflow: hidden;
    }
    .rec-icon img { width: 100%; height: 100%; object-fit: cover; }

    .rec-icon-wrap svg {
      position: absolute;
      top: -4px;
      left: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      transform: rotate(-90deg);
    }

    .progress-ring-bg {
      fill: none;
      stroke: rgba(0,0,0,0.1);
      stroke-width: 2.5;
    }

    .progress-ring-fill {
      fill: none;
      stroke: #333;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 113; /* circumference: 2π × 18 ≈ 113 */
      stroke-dashoffset: 0;
    }

    .progress-ring-fill.running {
      animation: ring-drain 3s linear forwards;
    }

    @keyframes ring-drain {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 113; }
    }

    /* Waveform bars */
    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 1.75rem;
    }

    .waveform span {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: #333;
      transform-origin: center;
      animation: wave 0.55s ease-in-out infinite alternate;
    }
    .waveform span:nth-child(1) { height: 8px;  animation-delay: 0s;    }
    .waveform span:nth-child(2) { height: 18px; animation-delay: 0.1s;  }
    .waveform span:nth-child(3) { height: 24px; animation-delay: 0.2s;  }
    .waveform span:nth-child(4) { height: 14px; animation-delay: 0.15s; }
    .waveform span:nth-child(5) { height: 8px;  animation-delay: 0.05s; }

    @keyframes wave {
      from { transform: scaleY(0.35); }
      to   { transform: scaleY(1);    }
    }
  </style>
</head>
<body>
  <!-- Default popup -->
  <div class="popup" id="popup">
    <button class="btn-dismiss" id="btnDismiss" title="Dismiss">✕</button>
    <div class="icon"><img src="./images/xyne.png" alt="Xyne" /></div>
    <div class="text">
      <div class="title" id="title">Meeting detected</div>
      <div class="subtitle">Start recording to capture notes</div>
    </div>
    <button class="btn-record" id="btnRecord">Start recording</button>
  </div>

  <!-- Compact recording-started pill -->
  <div class="recording-pill" id="recordingPill">
    <div class="rec-icon-wrap">
      <div class="rec-icon"><img src="./images/xyne.png" alt="Xyne" /></div>
      <svg viewBox="0 0 44 44">
        <circle class="progress-ring-bg" cx="22" cy="22" r="18"/>
        <circle class="progress-ring-fill" id="progressRing" cx="22" cy="22" r="18"/>
      </svg>
    </div>
    <div class="waveform">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <script>
    const APP_LABELS = {
      'zoom': 'Zoom',
      'microsoft-teams': 'Microsoft Teams',
      'slack-huddle': 'Slack',
      'google-meet': 'Google Meet',
      'browser-meeting': 'Meeting',
      'unknown': 'Meeting',
    };

    const popup = document.getElementById('popup');
    const titleEl = document.getElementById('title');

    function reportSize(isRecording) {
      requestAnimationFrame(() => {
        const el = isRecording
          ? document.getElementById('recordingPill')
          : document.getElementById('popup');
        const rect = el.getBoundingClientRect();
        // Add body padding (0.75rem top/bottom = 12px each, 0.5rem left/right = 8px each)
        const w = Math.ceil(rect.width) + 16;
        const h = Math.ceil(rect.height) + 24;
        window.electronAPI?.ipcSend?.('meeting-popup:content-height', w, h);
      });
    }

    function showMeeting(data) {
      const label = APP_LABELS[data.app] || 'Meeting';
      titleEl.textContent = 'Meeting detected — ' + label;
      document.body.classList.remove('recording-mode');
      popup.classList.remove('hiding');
      popup.classList.add('visible');
      reportSize(false);
    }

    function hidePopup() {
      popup.classList.add('hiding');
    }

    function showRecordingStarted() {
      document.body.classList.add('recording-mode');
      reportSize(true);
      // Start the circular drain animation — matches the 3s delay in the main process
      requestAnimationFrame(() => {
        document.getElementById('progressRing').classList.add('running');
      });
    }

    document.getElementById('btnRecord').addEventListener('click', () => {
      showRecordingStarted();
      window.electronAPI?.meetingPopup?.startRecording();
    });

    document.getElementById('btnDismiss').addEventListener('click', () => {
      window.electronAPI?.meetingPopup?.dismiss();
    });

    if (window.electronAPI?.meetingPopup) {
      window.electronAPI.meetingPopup.onShow(showMeeting);
      window.electronAPI.meetingPopup.onUpdate(showMeeting);
      window.electronAPI.meetingPopup.onHide(hidePopup);
    }
  </script>
</body>
</html>
