<!DOCTYPE html>
<html data-theme="classic">

<head>
    <meta charset="UTF-8">
    <title>Initializing</title>
    <script src="./theme.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--page-bg);
            color: var(--text);
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .brand img:first-child { width: 52px; height: 52px; }
        .brand img:last-child { width: auto; height: 30px; }
        .progress {
            width: 156px;
            height: 3px;
            margin: 0 auto 18px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(127, 127, 127, 0.18);
        }
        .progress::after {
            content: '';
            display: block;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: var(--accent);
            animation: progress 1.1s ease-in-out infinite;
        }
        p { margin: 0; color: var(--muted); font-size: 13px; }
        @keyframes progress { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
        @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } }
    </style>
    <link rel="stylesheet" href="./theme.css">
</head>

<body>
    <div class="container">
        <div class="brand">
            <img src="./images/xyne_logo_loading.png" alt="">
            <img src="./images/spaces_logo_loading.png" alt="Xyne Spaces">
        </div>
        <div class="progress"></div>
        <p>Starting your workspace...</p>
    </div>
</body>

</html>
