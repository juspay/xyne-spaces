<!DOCTYPE html>
<html lang="en" data-theme="classic">

<head>
    <meta charset="UTF-8">
    <title>Xyne Spaces</title>
    <!--
      The first of the two documents a cold start paints. It must look identical to the splash
      inlined in the dashboard's index.html, because the user sees them back to back across a
      document navigation: any difference in ground colour or mark position reads as a flash.

      The mark is inlined as a data URI so this paints on the first frame with zero requests.
      Previously this page said "Initializing Xyne Spaces..." over a spinner, which looked
      nothing like the branded loader that followed it.
    -->
    <style>
        :root {
            --splash-bg: #ffffff;
        }

        [data-theme="midnight"] {
            --splash-bg: #1a1a1f;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--splash-bg);
        }

        .splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--splash-bg);
        }

        .splash-logo {
            width: 80px;
            height: 80px;
        }

        .splash-word {
            width: 120px;
        }

        /* Only surfaced once the wait is long enough to need explaining — on macOS the keychain
           can put a password prompt in front of the app, and a user staring at a logo has no
           way to know that is what they are waiting for. */
        .splash-hint {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 420px;
            margin: 0;
            padding: 0 24px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            color: #717784;
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }

        .splash-hint.is-visible {
            opacity: 1;
        }
    </style>
</head>

    <p class="splash-hint" id="hint">
        Still working. Check for any system prompt asking for password access (Keychain Access on
        macOS).
    </p>
    <script>
        // The theme is passed in by the main process, which remembers the renderer's last choice.
        // Without it a midnight user gets a white flash before the dark app paints.
        const theme = new URLSearchParams(location.search).get('theme');
        if (theme === 'midnight' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'midnight');
        }

        setTimeout(() => document.getElementById('hint').classList.add('is-visible'), 4000);
    </script>
