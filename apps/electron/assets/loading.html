<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Initializing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        p {
            margin-bottom: 1rem;
            line-height: 1.5;
            color: #666;
            font-size: 14px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Initializing Xyne Spaces...</h1>
        <p>Please check for any system prompts asking for password access (e.g. Keychain Access).</p>
    </div>
</body>

</html>
