<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0c0a12;
        --muted: #6b6577;
        --line: rgba(12, 10, 18, 0.09);
        --chip-bg: rgba(12, 10, 18, 0.05);
        --btn-bg: rgba(12, 10, 18, 0.05);
        --btn-bg-hover: rgba(12, 10, 18, 0.1);
        --accent: #15803d;
      }

      body.dark {
        --bg: #1c1824;
        --fg: #eae6f1;
        --muted: #9a93a8;
        --line: rgba(255, 255, 255, 0.1);
        --chip-bg: rgba(255, 255, 255, 0.07);
        --btn-bg: rgba(255, 255, 255, 0.08);
        --btn-bg-hover: rgba(255, 255, 255, 0.14);
        --accent: #4ade80;
      }

      body.needs-input {
        --accent: #b45309;
      }
      body.dark.needs-input {
        --accent: #fbbf24;
      }
      body.error {
        --accent: #be123c;
      }
      body.dark.error {
        --accent: #fb7185;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }

      #card {
        margin: 6px;
        padding: 12px 13px 11px;
        border-radius: 14px;
        background: var(--bg);
        color: var(--fg);
        box-shadow:
          0 0 0 0.5px var(--line),
          0 6px 14px rgba(0, 0, 0, 0.12),
          0 18px 34px -12px rgba(0, 0, 0, 0.22);
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 180ms ease-out,
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      body.visible #card {
        opacity: 1;
        transform: translateY(0);
      }

      body.hiding #card {
        opacity: 0;
        transform: translateY(-6px);
        transition-duration: 160ms;
      }

      #head {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      #dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }

      #title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      #preview {
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.42;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      #actions {
        margin-top: 10px;
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }

      button {
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        color: var(--fg);
        border: 0;
        border-radius: 7px;
        padding: 5px 11px;
        background: var(--btn-bg);
        cursor: default;
        transition: background 120ms ease-out;
      }

      button:hover {
        background: var(--btn-bg-hover);
      }

      button#open {
        background: var(--chip-bg);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      @media (prefers-reduced-motion: reduce) {
        #card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="head">
        <span id="dot"></span>
        <span id="title">Claw finished</span>
      </div>
      <div id="preview"></div>
      <div id="actions">
        <button type="button" id="dismiss">Dismiss</button>
        <button type="button" id="open">Open</button>
      </div>
    </div>
    <script>
      const api = window.electronAPI && window.electronAPI.clawCompletion;
      const titleEl = document.getElementById('title');
      const previewEl = document.getElementById('preview');

      const TITLES = {
        idle: 'Claw finished',
        'needs-input': 'Claw needs your input',
        error: 'Claw hit an error',
      };

      if (api) {
        api.onShow((payload) => {
          document.body.classList.toggle('dark', !!payload.dark);
          document.body.classList.remove('needs-input', 'error');
          if (payload.outcome === 'needs-input') {
            document.body.classList.add('needs-input');
          } else if (payload.outcome === 'error') {
            document.body.classList.add('error');
          }
          titleEl.textContent = TITLES[payload.outcome] || TITLES.idle;
          previewEl.textContent = payload.preview || '';
          previewEl.style.display = payload.preview ? '' : 'none';
          requestAnimationFrame(() => document.body.classList.add('visible'));
        });

        api.onHide(() => {
          document.body.classList.add('hiding');
        });
      }

      document.getElementById('open').addEventListener('click', () => api && api.open());
      document.getElementById('dismiss').addEventListener('click', () => api && api.dismiss());
    </script>
  </body>
</html>
