<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Recording</title>
  <style>
    :root {
      --green: #1f9d4d;
      --amber: #b7791f;
      --red: #e04330;
      --red-hover: #c93a28;
      --red-active: #b23222;
      --ink: #1d1d1f;
      --card-bg: #fff;
      --card-border: rgba(0, 0, 0, 0.08);
      --row-hover: rgba(0, 0, 0, 0.05);
      --row-active: rgba(0, 0, 0, 0.09);
      --card-collapsed-w: 40px;
      --card-expanded-w: 92px;
      --gutter: 32px;
      --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
    }

    :root[data-theme="dark"] {
      --green: #30bf63;
      --amber: #e5a53a;
      --ink: #f2f2f3;
      --card-bg: #2c2c2e;
      --card-border: rgba(255, 255, 255, 0.12);
      --row-hover: rgba(255, 255, 255, 0.08);
      --row-active: rgba(255, 255, 255, 0.13);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      overflow: hidden;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: var(--gutter);
    }

    .card {
      cursor: grab;
      width: var(--card-collapsed-w);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      padding: 6px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow:
        0 0 0 0.5px var(--card-border),
        0 2px 6px rgba(0, 0, 0, 0.10),
        0 8px 20px rgba(0, 0, 0, 0.16);
      opacity: 0;
      transform: translateX(8px);
      transition:
        width 0.24s var(--ease-out),
        border-radius 0.24s var(--ease-out),
        opacity 0.12s ease,
        transform 0.12s ease;
    }

    .card.dragging { cursor: grabbing; }

    .card.visible { opacity: 1; transform: translateX(0); }
    .card.hiding  { opacity: 0; transform: translateX(8px); }

    .card.expanded {
      width: var(--card-expanded-w);
      border-radius: 14px;
    }

    .row {
      position: relative;
      display: flex;
      align-items: center;
      height: 24px;
      border: none;
      background: none;
      font: inherit;
      color: var(--ink);
      border-radius: 8px;
    }

    button.row { cursor: pointer; }
    button.row:hover { background: var(--row-hover); }
    button.row:active { background: var(--row-active); }

    button.row, .stop {
      transition-property: background, transform;
      transition-duration: 0.15s;
      transition-timing-function: ease;
    }
    button.row:active, .stop:active { transform: scale(0.96); }
    .card.dragging button.row:active,
    .card.dragging .stop:active { transform: none; }

    button.row::after, .stop::after {
      content: '';
      position: absolute;
      inset: -2px 0;
    }

    .icon-slot {
      width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .label {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 12px;
      transition: max-width 0.24s var(--ease-out), opacity 0.16s ease;
    }

    .card.expanded .label { max-width: 50px; opacity: 1; }

    .timer {
      color: var(--green);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    #rowResume { display: none; }
    .card.paused #rowTimer { display: none; }
    .card.paused #rowResume { display: flex; }

    #rowStarting { display: none; }
    .card.starting #rowTimer,
    .card.starting #rowResume { display: none; }
    .card.starting #rowStarting { display: flex; }

    .spinner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      border-top-color: var(--green);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .starting-label {
      color: var(--green);
      font-weight: 600;
    }

    .resume-label {
      color: var(--amber);
      font-weight: 600;
    }

    .resume-icon {
      width: 0;
      height: 0;
      margin-left: 2px;
      border-style: solid;
      border-width: 5px 0 5px 8px;
      border-color: transparent transparent transparent var(--amber);
    }

    .open-label { font-weight: 500; }

    .waveform {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 12px;
    }
    .waveform span {
      width: 2px;
      height: 12px;
      border-radius: 1px;
      background: var(--green);
      transform-origin: center;
      animation: wave var(--dur) ease-in-out var(--delay) infinite;
    }
    .waveform span:nth-child(1) { --dur: 1.15s; --delay: -0.9s;  }
    .waveform span:nth-child(2) { --dur: 0.85s; --delay: -0.35s; }
    .waveform span:nth-child(3) { --dur: 1.35s; --delay: -0.6s;  }
    .waveform span:nth-child(4) { --dur: 0.95s; --delay: -1.1s;  }
    .waveform span:nth-child(5) { --dur: 1.25s; --delay: -0.2s;  }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.30); }
      30%      { transform: scaleY(1);    }
      55%      { transform: scaleY(0.45); }
      80%      { transform: scaleY(0.75); }
    }

    .stop {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 8px;
    }

    .stop .icon-slot { height: 100%; }

    .stop-chip {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .stop:hover .stop-chip  { background: var(--red-hover); }
    .stop:active .stop-chip { background: var(--red-active); }

    .stop-square {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: #fff;
    }

    .card.expanded .stop { background: var(--red); }
    .card.expanded .stop:hover  { background: var(--red-hover); }
    .card.expanded .stop:active { background: var(--red-active); }
    .card.expanded .stop .stop-chip { background: transparent; }

    .stop .label {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="row" id="rowTimer">
      <span class="icon-slot">
        <span class="waveform"><span></span><span></span><span></span><span></span><span></span></span>
      </span>
      <span class="label timer" id="timer">0s</span>
    </div>

    <div class="row" id="rowStarting">
      <span class="icon-slot"><span class="spinner"></span></span>
      <span class="label starting-label">Starting</span>
    </div>

    <button class="row" id="rowResume" title="Resume recording">
      <span class="icon-slot"><span class="resume-icon"></span></span>
      <span class="label resume-label">Resume</span>
    </button>

    <button class="row" id="btnOpen" title="Open Xyne">
      <span class="icon-slot">
        <svg width="16" height="16" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg>
      </span>
      <span class="label open-label">Open</span>
    </button>

    <button class="stop" id="btnStop" title="Stop recording">
      <span class="icon-slot"><span class="stop-chip"><span class="stop-square"></span></span></span>
      <span class="label">Stop</span>
    </button>
  </div>

  <script>
    const card = document.getElementById('card');
    const timerEl = document.getElementById('timer');
    let state = { starting: false, startTime: null, paused: false, pauseStartedAt: null, accumulatedPausedMs: 0 };
    let timerInterval = null;
    let collapseTimer = null;

    function formatTime(totalSeconds) {
      if (totalSeconds < 60) return totalSeconds + 's';
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    function elapsedSeconds() {
      if (!state.startTime) return 0;
      const until = state.pauseStartedAt || Date.now();
      return Math.max(0, Math.floor((until - state.startTime - state.accumulatedPausedMs) / 1000));
    }

    function renderTimer() {
      timerEl.textContent = formatTime(elapsedSeconds());
    }

    function applyState(next) {
      const starting = !!(next && next.starting);
      state = {
        starting,
        startTime: (next && next.startTime) || (starting ? null : Date.now()),
        paused: !!(next && next.paused),
        pauseStartedAt: (next && next.pauseStartedAt) || null,
        accumulatedPausedMs: (next && next.accumulatedPausedMs) || 0,
      };
      card.classList.toggle('starting', starting);
      card.classList.toggle('paused', state.paused && !starting);
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (starting) return;
      renderTimer();
      if (!state.paused) timerInterval = setInterval(renderTimer, 1000);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      state = { starting: false, startTime: null, paused: false, pauseStartedAt: null, accumulatedPausedMs: 0 };
      card.classList.remove('paused');
      card.classList.remove('starting');
    }

    const DRAG_THRESHOLD = 4;
    let pressed = null;
    let dragging = false;
    let didDrag = false;

    card.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      pressed = { x: e.screenX, y: e.screenY };
      didDrag = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!pressed || dragging) return;
      const moved =
        Math.abs(e.screenX - pressed.x) + Math.abs(e.screenY - pressed.y);
      if (moved > DRAG_THRESHOLD) {
        dragging = true;
        didDrag = true;
        card.classList.add('dragging');
        window.electronAPI?.recordingPill?.dragStart();
      }
    });

    window.addEventListener('mouseup', () => {
      pressed = null;
      if (!dragging) return;
      dragging = false;
      card.classList.remove('dragging');
      window.electronAPI?.recordingPill?.dragEnd();
    });

    card.addEventListener(
      'click',
      (e) => {
        if (didDrag) {
          e.stopPropagation();
          e.preventDefault();
          didDrag = false;
        }
      },
      true,
    );

    let lastIgnoreMouse = null;
    function setIgnoreMouse(ignore) {
      if (lastIgnoreMouse === ignore) return;
      lastIgnoreMouse = ignore;
      window.electronAPI?.recordingPill?.setIgnoreMouse(ignore);
    }

    function expand() {
      if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
      card.classList.add('expanded');
      setIgnoreMouse(false);
    }

    function scheduleCollapse() {
      if (dragging) return;
      if (collapseTimer) clearTimeout(collapseTimer);
      collapseTimer = setTimeout(() => {
        collapseTimer = null;
        card.classList.remove('expanded');
        setIgnoreMouse(true);
      }, 200);
    }

    card.addEventListener('mouseenter', expand);
    card.addEventListener('mouseover', expand);
    card.addEventListener('mouseleave', scheduleCollapse);

    function show(nextState) {
      card.classList.remove('hiding');
      card.classList.add('visible');
      applyState(nextState);
    }

    function hide() {
      card.classList.add('hiding');
      card.classList.remove('expanded');
      if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
      lastIgnoreMouse = null;
      stopTimer();
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    }

    document.getElementById('btnOpen').addEventListener('click', () => {
      window.electronAPI?.recordingPill?.openApp();
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      window.electronAPI?.recordingPill?.stopRecording();
    });

    document.getElementById('rowResume').addEventListener('click', () => {
      window.electronAPI?.recordingPill?.resumeRecording();
    });

    if (window.electronAPI?.recordingPill) {
      window.electronAPI.recordingPill.onShow((nextState) => show(nextState));
      window.electronAPI.recordingPill.onHide(hide);
      window.electronAPI.recordingPill.onThemeChanged(applyTheme);
    }
  </script>
</body>
</html>
