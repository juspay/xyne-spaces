<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting… | Xyne Spaces</title>
    <link rel="icon" type="image/png" href="xyne logo.png" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            text-align: center;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            color: #1d1d1f;
            font-size: 24px;
        }

        p {
            margin: 0 0 1.5rem;
            color: #86868b;
            line-height: 1.5;
            font-size: 15px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-size: 16px;
        }

        .button-primary {
            background-color: #0071e3;
            color: white;
        }

        .button-primary:hover {
            background-color: #0077ed;
            transform: translateY(-1px);
        }

        .button-secondary {
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .button-secondary:hover {
            background-color: #e8e8ed;
        }

        .footer {
            margin-top: 2rem;
            font-size: 13px;
            color: #86868b;
        }

        .info-box {
            background-color: #f9f9fa;
            border: 1px solid #e5e5e5;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
            color: #555;
            text-align: left;
        }

        .hidden {
            display: none;
        }
    </style>
    <script>
        window.onload = function () {
            let deepLink = "xyne-spaces://";
            // Logic to handle both new Path-based and old Query-based links
            const urlParams = new URLSearchParams(window.location.search);
            const legacyPath = urlParams.get('path');
            if (legacyPath) {
                deepLink += decodeURIComponent(legacyPath);
            } else {
                const path = window.location.pathname;
                if (path && path !== "/" && path !== "/index.html") {
                    const cleanPath = path.startsWith('/') ? path.substring(1) : path;
                    deepLink += cleanPath;
                }
            }
            window.location.href = deepLink;
            // Platform Detection & UI Update
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/i.test(userAgent);
            const isMobile = isAndroid || isIOS;
            const openBtn = document.getElementById('open-app-btn');
            const downloadBtn = document.getElementById('download-btn');
            const infoBox = document.getElementById('info-box');
            if (openBtn) openBtn.href = deepLink;
            if (isMobile) {
                if (downloadBtn) {
                    downloadBtn.classList.remove('hidden');
                    if (isAndroid) {
                        downloadBtn.href = "https://firebasestorage.googleapis.com/v0/b/xyne-spaces.firebasestorage.app/o/app%20(1).apk?alt=media&token=03f41183-48fd-4658-bedf-b21a86de6114";
                        downloadBtn.innerHTML = "Download App (Android)";
                    } else if (isIOS) {
                        downloadBtn.href = "https://firebasestorage.googleapis.com/v0/b/YOUR_PROJECT_ID.appspot.com/o/app.ipa?alt=media"; // Replace with your IPA URL
                        downloadBtn.innerHTML = "Download App (iOS)";
                    }
                }
                if (infoBox) infoBox.style.display = 'none';
            } else {
                if (downloadBtn) {
                    downloadBtn.classList.remove('hidden');
                    downloadBtn.href = "kandji-self-service://library/items/1a372eff-80ca-4858-a38f-0bb89dd5307d";
                    downloadBtn.innerHTML = "Install via Kandji";
                }
                if (infoBox) infoBox.style.display = 'none';
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <!-- Logo -->
        <img src="xyne.svg" alt="Xyne Spaces" class="logo" />

        <h1>Xyne Spaces</h1>
        <p>Opening content in the app...</p>

        <!-- Primary Action: Open App -->
        <a href="#" id="open-app-btn" class="button button-primary">Open Application</a>

        <!-- Secondary Action: Download (Mobile Only) -->
        <a href="#" id="download-btn" class="button button-secondary hidden">Download App</a>

        <!-- Info Box (Mobile Only) -->
        <div id="info-box" class="info-box hidden"></div>
    </div>

    <div class="footer">
        If nothing happens, click "Open Application" above.
    </div>
</body>

</html>
