worker_processes auto;
error_log /tmp/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # WebSocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Map user-agent to bundle branch name for test environment routing
    # Pattern: devqa-xyne-picaf-2878 -> devqa-xyne-picaf-2878
    # Pattern: devqa-xyne-feature-abc -> devqa-xyne-feature-abc
    map $http_user_agent $bundle_branch {
        default "";
        "~*devqa-xyne-([a-zA-Z0-9_-]+)" "devqa-xyne-$1";
    }

    # Per-user bundle routing. Same mechanism as the devqa branch above, but the
    # selector is the `x_bundle_uid` cookie (the logged-in userId, set by the app
    # after login). The userId->folder mapping lives in an included file that is
    # synced from GCS into the pod and applied on `nginx -s reload`.
    #   bundle-map.conf entries look like:   "userId_abc" "beta-v2";
    map $cookie_x_bundle_uid $user_bundle_folder {
        default "";
        include /etc/nginx/bundle-map.conf;
    }

    # Effective bundle folder for a request. Precedence:
    #   1. devqa User-Agent branch (test envs)  2. per-user cookie folder
    #   3. "default" (the production bundle, served from GCS like every other folder)
    # NOTE: unlike the old setup, the default bundle now also comes from GCS
    # (folder "default/"), not the image-baked local files.
    map "$bundle_branch:$user_bundle_folder" $bundle_folder {
        default "default";
        "~^(?<b>devqa-xyne-[a-zA-Z0-9_-]+):"  $b;   # devqa wins if present
        "~^:(?<u>.+)$"                        $u;   # else per-user cookie folder
    }

    # Migration feature flag from environment variable
    map "${ENABLE_MIGRATION}" $migration_enabled {
        default 0;
        "true" 1;
        "1" 1;
    }

    # LiveKit backend upstream

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Migration service proxy - conditionally enabled via ENABLE_MIGRATION env var
        location /migration/ {
            # Return 404 if migration is not enabled
            if ($migration_enabled = 0) {
                return 404;
            }

            set $migration_upstream "http://migration";
            proxy_pass $migration_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Handle upstream errors gracefully
            proxy_intercept_errors on;
            error_page 502 503 504 = @migration_unavailable;
        }

        # Fallback when migration service is unavailable
        location @migration_unavailable {
            default_type application/json;
            return 503 '{"error": "Migration service temporarily unavailable"}';
        }
        
        # API proxy to backend service

        # Zero server proxy removed - now handled by GKE Ingress directly
        # Requests to /zero/ will go through ingress to xyne-spaces-zero pods
        # This enables cookie-based session affinity at the load balancer level

        # LiveKit WebSocket and HTTP endpoints


        # LiveKit API endpoints (twirp RPC)

        # SDLC lane SPA. Present only in the SDLC image (STATIC_SUBDIR=sdlc-app);
        # in the main image the directory does not exist and these 404.
        location = /sdlc-app/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            etag off;
            if_modified_since off;
            add_header Last-Modified "";
        }

        # Falls back to the SDLC bundle's own index.html, never the main one's.
        location /sdlc-app/ {
            try_files $uri $uri/ /sdlc-app/index.html;
        }

        # Explicitly disable cache for index.html (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            etag off;
            if_modified_since off;
            add_header Last-Modified "";
        }

        # Handle client-side routing. Every request is served from GCS via the
        # backend, using $bundle_folder (per-user cookie / devqa / "default").
        # The backend applies SPA index.html fallback and default-folder fallback.
        location / {
            error_page 418 = @bundle_proxy;
            return 418;
        }

        # Static assets: same per-folder routing to GCS via the backend.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            error_page 418 = @bundle_proxy;
            return 418;
        }

        # Serve ZIP files for Electron OTA updates (no long cache - always fresh)
        location /releases/ {
            add_header Content-Type application/zip;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Named location that streams the requested file from the selected bundle
        # folder in GCS (via the backend). $bundle_folder is per-user cookie /
        # devqa branch / "default". Used for both SPA routes and static assets.
        location @bundle_proxy {
            rewrite ^/(.*)$ /api/bundles/$bundle_folder/$1 break;
            proxy_pass http://xyne-backend.xyne-apps.svc.cluster.local:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            # Hide backend's restrictive security headers
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: https:; img-src 'self' data: https: blob:;" always;
    }
}
