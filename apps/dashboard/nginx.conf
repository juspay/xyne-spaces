worker_processes auto;
error_log /tmp/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Distinct format for bundle-serving fallbacks: tags each line with
    # [bundle-fallback] and records the resolved $bundle_path so a spike in the
    # local-baked fallback (backend/GCS unavailable) is greppable and alertable.
    log_format fallback '[bundle-fallback] $remote_addr [$time_local] "$request" '
                        'status=$status bundle_path=$bundle_path '
                        'ua="$http_user_agent"';

    access_log /tmp/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # WebSocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Map user-agent to bundle branch name for test environment routing
    # Pattern: devqa-xyne-picaf-2878 -> devqa-xyne-picaf-2878
    # Pattern: devqa-xyne-feature-abc -> devqa-xyne-feature-abc
    map $http_user_agent $bundle_branch {
        default "";
        "~*devqa-xyne-([a-zA-Z0-9_-]+)" "devqa-xyne-$1";
    }

    # Bundle path segment sent to the backend. Precedence:
    #   1. devqa User-Agent branch (test envs)      -> that explicit folder
    #   2. everyone else                            -> "me" (the backend resolves
    #      the per-user folder from the VERIFIED JWT it receives, defaulting to
    #      the "default" GCS folder). The folder choice is made server-side from a
    #      validated token, so it cannot be spoofed by the client.
    map $bundle_branch $bundle_path {
        default "me";
        "~^(?<b>devqa-xyne-[a-zA-Z0-9_-]+)$" $b;
    }

    # Migration feature flag from environment variable
    map "${ENABLE_MIGRATION}" $migration_enabled {
        default 0;
        "true" 1;
        "1" 1;
    }

    # LiveKit backend upstream

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Migration service proxy - conditionally enabled via ENABLE_MIGRATION env var
        location /migration/ {
            # Return 404 if migration is not enabled
            if ($migration_enabled = 0) {
                return 404;
            }

            set $migration_upstream "http://migration";
            proxy_pass $migration_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Handle upstream errors gracefully
            proxy_intercept_errors on;
            error_page 502 503 504 = @migration_unavailable;
        }

        # Fallback when migration service is unavailable
        location @migration_unavailable {
            default_type application/json;
            return 503 '{"error": "Migration service temporarily unavailable"}';
        }
        
        # API proxy to backend service

        # Zero server proxy removed - now handled by GKE Ingress directly
        # Requests to /zero/ will go through ingress to xyne-spaces-zero pods
        # This enables cookie-based session affinity at the load balancer level

        # LiveKit WebSocket and HTTP endpoints


        # LiveKit API endpoints (twirp RPC)

        # SDLC lane SPA. Present only in the SDLC image (STATIC_SUBDIR=sdlc-app);
        # in the main image the directory does not exist and these 404.
        location = /sdlc-app/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            etag off;
            if_modified_since off;
            add_header Last-Modified "";
        }

        # Falls back to the SDLC bundle's own index.html, never the main one's.
        location /sdlc-app/ {
            try_files $uri $uri/ /sdlc-app/index.html;
        }

        # Explicitly disable cache for index.html (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            etag off;
            if_modified_since off;
            add_header Last-Modified "";
        }

        # Handle client-side routing. Primary path: serve from GCS via the backend
        # ($bundle_path = "me" -> backend resolves the per-user folder from the JWT,
        # or an explicit devqa branch). If that path fails (backend down, GCS error,
        # timeout, 5xx) we FALL BACK to the previous flow: the image-baked local
        # bundle. See @bundle_proxy / @local_fallback.
        location / {
            error_page 418 = @bundle_proxy;
            return 418;
        }

        # Static assets: same per-folder routing to GCS via the backend, same fallback.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            error_page 418 = @bundle_proxy;
            return 418;
        }

        # Serve ZIP files for Electron OTA updates (no long cache - always fresh)
        location /releases/ {
            add_header Content-Type application/zip;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # PRIMARY (new flow): stream the requested file from the bundle folder in
        # GCS via the backend. $bundle_path = "me" (per-user, resolved by the
        # backend from the JWT) or an explicit devqa branch. The client's auth
        # cookie is forwarded so the backend can verify it.
        #
        # RESILIENCE: proxy_intercept_errors + error_page route any upstream
        # failure (connection refused, timeout, 5xx) to @local_fallback, which
        # serves the image-baked bundle — the previous, pre-GCS behaviour. This
        # guarantees the app still loads if the backend or GCS is unavailable.
        location @bundle_proxy {
            rewrite ^/(.*)$ /api/bundles/$bundle_path/$1 break;
            proxy_pass http://xyne-backend.xyne-apps.svc.cluster.local:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            # Hide backend's restrictive security headers
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;

            # Fall back to the local baked bundle on any upstream failure.
            proxy_intercept_errors on;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            error_page 500 502 503 504 = @local_fallback;
        }

        # FALLBACK (previous flow): serve the image-baked bundle from local disk.
        # Reached only when @bundle_proxy fails. $uri is the ORIGINAL request URI
        # (the internal rewrite in @bundle_proxy does not affect it here), so a
        # deep-linked SPA route still resolves to the local index.html.
        # A dedicated access-log line makes every fallback visible for alerting.
        location @local_fallback {
            access_log /tmp/access.log fallback;
            try_files $uri $uri/ /index.html;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: https:; img-src 'self' data: https: blob:;" always;
    }
}
