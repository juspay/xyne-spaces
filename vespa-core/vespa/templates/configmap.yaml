apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "vespa-app.labels" . | nindent 4 }}
data:
  services.xml: |
    {{- include "vespa-app.servicesXml" . | nindent 4 }}
  hosts.xml: |
    {{- include "vespa-app.hostsXml" . | nindent 4 }}
  validation-overrides.xml: |
    {{- .Files.Get "common/validation-overrides.xml" | nindent 4 }}
{{- range $path, $_ := .Files.Glob "common/schemas/*.sd" }}
  schema.{{ base $path }}: |
    {{- regexReplaceAll "v\\[(?:DIMS|\\d+)\\]" ($.Files.Get $path) (printf "v[%d]" (int $.Values.embedder.dimensions)) | nindent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "common/rules/*" }}
  rules.{{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
  deploy.sh: |
    set -eu
    cs="http://{{ include "vespa-app.configserver" . }}:{{ .Values.configserver.port }}"
    deadline=$(( $(date +%s) + {{ int .Values.deploy.timeoutSeconds }} ))
    remaining() { [ "$(date +%s)" -lt "$deadline" ]; }
    app=/tmp/app
    mkdir -p "$app/schemas" "$app/rules"
    cp -L /package/services.xml /package/hosts.xml /package/validation-overrides.xml "$app/"
    for f in /package/schema.*; do cp -L "$f" "$app/schemas/${f#/package/schema.}"; done
    for f in /package/rules.*; do [ -e "$f" ] && cp -L "$f" "$app/rules/${f#/package/rules.}"; done
    (cd "$app" && tar -czf /tmp/app.tgz .)
    echo "application package: $(find "$app" -type f | wc -l) files"
    until curl -sf -o /dev/null "$cs/state/v1/health"; do
      remaining || { echo "config server $cs not healthy in time"; exit 1; }
      echo "waiting for config server $cs"
      sleep 10
    done
    until code=$(curl -s -o /tmp/deploy.json -w '%{http_code}' -H 'Content-Type: application/x-gzip' --data-binary @/tmp/app.tgz "$cs/application/v2/tenant/default/prepareandactivate") && [ "$code" = 200 ]; do
      echo "prepareandactivate returned $code:"
      head -c 4000 /tmp/deploy.json; echo
      remaining || exit 1
      sleep 20
    done
    head -c 4000 /tmp/deploy.json; echo
    converge="$cs/application/v2/tenant/default/application/default/environment/prod/region/default/instance/default/serviceconverge"
    until curl -sf "$converge" | grep -q '"converged":true'; do
      remaining || { echo "services did not converge in time:"; curl -s "$converge" | head -c 4000; echo; exit 1; }
      echo "waiting for services to converge on the new generation"
      sleep 15
    done
    echo "vespa application deployed and converged"
