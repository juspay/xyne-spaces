<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Connection Error</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #F2F4F8;
            color: #181B25;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 2px 8px 1px rgba(5, 5, 6, 0.07);
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 1rem;
            color: #181B25;
        }

        p {
            margin-bottom: 1.5rem;
            line-height: 1.5;
            color: #525866;
        }

        button {
            background-color: #2B7FFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0561E2;
        }

        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.9em;
            color: #717784;
        }

        .footer-text a {
            color: #2B7FFF;
            font-weight: bold;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Failed to Load</h1>
        <p>Failed to connect to the server. This could be a network issue. Check your network connection and try reloading.</p>
        <button id="reloadBtn">Reload Application</button>
        <p class="footer-text">
            If it still doesn't work, please report it in<br>
            the <a target="_blank" rel="noopener noreferrer" href="https://juspay.slack.com/archives/C0A2BFNLBB8">#xyne-spaces-troubleshooting</a> Slack channel.
        </p>
    </div>
    <script>
        document.getElementById('reloadBtn').addEventListener('click', () => {
            if (window.electronAPI && window.electronAPI.reloadApp) {
	                window.electronAPI.reloadApp();
            } else {
                location.reload();
            }
        });
    </script>
</body>

</html>
