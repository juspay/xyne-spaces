<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Certificate Issue</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #F5F5F5;
            color: #181B25;
        }

        .container {
            text-align: center;
            padding: 3rem 2.5rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 2px 8px 1px rgba(5, 5, 6, 0.07);
            max-width: 480px;
            width: 90%;
        }

        .icon-container {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #FFE5E5 0%, #FFD6D6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon {
            width: 32px;
            height: 32px;
            color: #FF4F4F;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 0.75rem;
            color: #181B25;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        p {
            margin-bottom: 2rem;
            line-height: 1.6;
            color: #525866;
            font-size: 15px;
        }

        button {
            background-color: #FF4F4F;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(255, 79, 79, 0.1);
            width: 100%;
            max-width: 240px;
        }

        button:hover {
            background-color: #e63946;
            box-shadow: 0 2px 4px rgba(255, 79, 79, 0.2);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 13px;
            color: #717784;
            line-height: 1.5;
        }

        .footer-text a {
            color: #FF4F4F;
            font-weight: 500;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon-container">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>
        <h1>Certificate Issue</h1>
        <p>Your device certificate is invalid or expired. Please re-enroll your device to continue using the application.</p>
        <button id="reEnrollBtn">Re-enroll Device</button>
        <p class="footer-text">
            Need help? Contact support in<br>
            the <a target="_blank" rel="noopener noreferrer" href="https://juspay.slack.com/archives/C0A473SV8CC">#xyne-app-issues</a> Slack channel.
        </p>
    </div>
    <script>
        document.getElementById('reEnrollBtn').addEventListener('click', () => {
            if (window.electronAPI && window.electronAPI.reloadApp) {
                window.electronAPI.reloadApp();
            } else {
                location.reload();
            }
        });
    </script>
</body>

</html>
