services:
  # db:push + raw-SQL migration in a one-shot container so backend's healthcheck
  # window doesn't include schema-apply work (which slows under CI CPU throttling).
  backend-migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.test
    container_name: ${COMPOSE_PROJECT_NAME:-xyne}-backend-migrate
    env_file:
      - ./apps/backend/.env.test
    restart: "no"
    command: sh -c "pnpm run db:push && pnpm exec prisma db push --schema prisma-common/schema.prisma --accept-data-loss --skip-generate && pnpm exec prisma db execute --file prisma/migrations/20251127175400_add_ticket_xyne_id_sequence/migration.sql --schema prisma/schema.prisma"
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API for testing - builds from Dockerfile.test
  # Loads .env.local as base, then .env.test overrides container-specific values
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.test
    container_name: ${COMPOSE_PROJECT_NAME:-xyne}-backend
    ports:
      - "${BACKEND_BIND_PORT:-0}:3001"
    env_file:
      - ./apps/backend/.env.test   # Override with container hostnames
    command: sh -c "/scripts/setup-fake-gcs-test.sh && pnpm run dev:test"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      zero-cache:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 240s  # Kept generous; backend boot is now just fake-gcs + tsx + listen.

  # Dashboard (Frontend) for testing - builds from Dockerfile.test
  # Loads .env.local as base, then .env.test overrides container-specific values
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile.test
    container_name: ${COMPOSE_PROJECT_NAME:-xyne}-dashboard
    env_file:
      - ./apps/dashboard/.env.test   # Override with container hostnames
    ports:
      - "${DASHBOARD_BIND_PORT:-0}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s  # Phase 1: Consistent with backend approach

