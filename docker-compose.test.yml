  # Automation Test Runner (Gauge). Gated behind `--profile gauge`
  xyne-automation:
    profiles: ["gauge"]
    build:
      context: ./tools/xyne-automation
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-xyne-test}-automation
    # Parallel Gauge workers each launch Chromium, all sharing this container's /dev/shm.
    shm_size: '4gb'
    environment:
      - TEST_ENV=test
      - BACKEND_URL=http://backend:3001
      - DASHBOARD_URL=http://dashboard:5173
      - BROWSER=chromium
      # Use the pre-baked image deps as-is: make pnpm non-interactive and stop it
      # re-verifying/reinstalling (a reinstall re-blocks @getgauge/cli's build script).
      - CI=true
      - NPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false
      - NPM_CONFIG_CONFIRM_MODULES_PURGE=false
      # Container-scoped log-noise suppression for the test run.
      - NPM_CONFIG_LOGLEVEL=error
      - NODE_NO_WARNINGS=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy

  # Automation Test Runner (Legacy Cucumber). Default for Jenkins; 
  xyne-automation-old:
    profiles: ["cucumber"]
    build:
      context: ./tools/xyne-automation-old
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-xyne-test}-automation-old
    shm_size: '2gb'
    environment:
      - TEST_ENV=test
      - BACKEND_URL=http://backend:3001
      - DASHBOARD_URL=http://dashboard:5173
      - BROWSER=chromium
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
  
  # Override Zero Cache to use internal container networking for tests
  zero-cache:
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      ZERO_MUTATE_URL: http://backend:3001/api/zero/push
      ZERO_QUERY_URL: http://backend:3001/api/zero/query
      # Higher sync capacity for parallel automation runs (test-only; dev keeps 5/10/10).
      # Parallel Gauge workers each open sync sessions, so the default worker/pool sizes
      # starve and channel/message queries don't land in time.
      ZERO_NUM_SYNC_WORKERS: "10"
      ZERO_CVR_MAX_CONNS: "30"
      ZERO_UPSTREAM_MAX_CONNS: "30"

  # Override Transcription Agent to use test Dockerfile (minimal deps, no torch/pyannote)
  # DISABLED: Tests only verify UI text, not actual transcription functionality
  transcription-agent:
    profiles: ["disabled"]

  # DISABLED: Tests don't use MinIO (S3-compatible storage)
  minio:
    profiles: ["disabled"]

  # DISABLED: Tests don't use call recording functionality
  livekit-egress:
    profiles: ["disabled"]

  # Disable monitoring services in test environment
  otel-collector:
    profiles: ["disabled"]
  
  victoriametrics:
    profiles: ["disabled"]

  grafana:
    profiles: ["disabled"]

volumes:
  transcription-agent-test-data:
    driver: local
  transcription-agent-app:
    driver: local
