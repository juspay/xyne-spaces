version: "3.8"

services:
  lighton-ocr:
    build: .
    container_name: lighton-ocr
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - PORT=${PORT:-8000}
      - LIGHTON_URL=${LIGHTON_URL:-http://192.168.1.112:5002/v1/chat/completions}
      - LIGHTON_MODEL=${LIGHTON_MODEL:-lightonai/LightOnOCR-2-1B-bbox}
      - LIGHTON_ACCESS_TOKEN=${LIGHTON_ACCESS_TOKEN:-}
      - LIGHTON_TIMEOUT_SECONDS=${LIGHTON_TIMEOUT_SECONDS:-60}
      - LIGHTON_CONCURRENCY=${LIGHTON_CONCURRENCY:-8}
      - LIGHTON_MAX_OUTPUT_TOKENS=${LIGHTON_MAX_OUTPUT_TOKENS:-8192}
      - LIGHTON_TEMPERATURE=${LIGHTON_TEMPERATURE:-0.0}
      - LIGHTON_RETRIES=${LIGHTON_RETRIES:-2}
      - LIGHTON_IMAGE_MAX_DIM=${LIGHTON_IMAGE_MAX_DIM:-1540}
      - OCR_RENDER_MAX_DIM=${OCR_RENDER_MAX_DIM:-1540}
      - OCR_PDF_RENDER_DPI=${OCR_PDF_RENDER_DPI:-200}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:--1}
      - OCR_OFFICE_CONVERT_TIMEOUT_SECONDS=${OCR_OFFICE_CONVERT_TIMEOUT_SECONDS:-120}
      - OCR_TEXT_PAGE_WIDTH=${OCR_TEXT_PAGE_WIDTH:-1240}
      - OCR_TEXT_PAGE_HEIGHT=${OCR_TEXT_PAGE_HEIGHT:-1754}
      - OCR_TEXT_FONT_SIZE=${OCR_TEXT_FONT_SIZE:-28}
      - OCR_TEXT_MARGIN=${OCR_TEXT_MARGIN:-72}
      - OCR_TEXT_FONT_PATH=${OCR_TEXT_FONT_PATH:-/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf}
      - LIGHTON_MAX_IMAGE_REGIONS_PER_PAGE=${LIGHTON_MAX_IMAGE_REGIONS_PER_PAGE:-256}
      - E5_TOKENIZER_PATH=${E5_TOKENIZER_PATH:-/app/e5-tokenizer}
      - MAX_TOKENS=${MAX_TOKENS:-460}
      - CHUNK_OVERLAP_TOKENS=${CHUNK_OVERLAP_TOKENS:-12}
      - IMAGE_CHUNK_MAX_TOKENS=${IMAGE_CHUNK_MAX_TOKENS:-460}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OCR_RUNTIME_CONFIG_KEY=${OCR_RUNTIME_CONFIG_KEY:-docling:runtime-config}
      - OCR_RUNTIME_CONFIG_POLL_SECONDS=${OCR_RUNTIME_CONFIG_POLL_SECONDS:-300}
      - OCR_RESULTS_STREAM=${OCR_RESULTS_STREAM:-docling:results}
      - OCR_RESULT_KEY_PREFIX=${OCR_RESULT_KEY_PREFIX:-docling:result}
      - OCR_RESULT_TTL_SECONDS=${OCR_RESULT_TTL_SECONDS:-604800}
      - OCR_ASYNC_JOB_TTL_SECONDS=${OCR_ASYNC_JOB_TTL_SECONDS:-86400}
      - OCR_ASYNC_MAX_INFLIGHT=${OCR_ASYNC_MAX_INFLIGHT:-1}
      - OCR_ASYNC_GLOBAL_MAX_INFLIGHT=${OCR_ASYNC_GLOBAL_MAX_INFLIGHT:--1}
      - OCR_ASYNC_GLOBAL_ADMISSION_KEY=${OCR_ASYNC_GLOBAL_ADMISSION_KEY:-docling:async:global:active}
      - OCR_ASYNC_GLOBAL_ADMISSION_LEASE_TTL_SECONDS=${OCR_ASYNC_GLOBAL_ADMISSION_LEASE_TTL_SECONDS:-86400}
      - OCR_ASYNC_RETRY_AFTER_SECONDS=${OCR_ASYNC_RETRY_AFTER_SECONDS:-180}
    restart: unless-stopped
