[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:transcription-agent]
command=python main.py start
directory=/app
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/var/log/transcription-agent.log
stderr_logfile=/var/log/transcription-agent.err
priority=10

[program:egress]
command=/usr/local/bin/egress
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/var/log/egress.log
stderr_logfile=/var/log/egress.err
priority=20
environment=EGRESS_CONFIG_FILE="/etc/egress.yaml"
