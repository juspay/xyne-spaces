[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ---- Core (always on) ----
[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data -c config_file=/var/lib/postgresql/data/postgresql.conf
user=postgres
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/postgresql.log
stderr_logfile=/var/log/postgresql.err
priority=10

[program:redis]
command=/usr/bin/redis-server --bind 0.0.0.0 --protected-mode no --save "" --appendonly no
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.err
priority=20

[program:zero-cache]
command=zero-cache
directory=/tmp
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/zero-cache.log
stderr_logfile=/var/log/zero-cache.err
priority=30
environment=PATH="/usr/bin:/usr/local/bin:/usr/sbin:/sbin:%(ENV_PATH)s",ZERO_LITESTREAM_EXECUTABLE="/usr/local/bin/litestream",ZERO_LITESTREAM_EXECUTABLE_V5="/usr/local/bin/litestream-v5",ZERO_LITESTREAM_CONFIG_PATH="/etc/litestream.yml",ZERO_LITESTREAM_BACKUP_URL="file:///var/zero/backup",ZERO_IN_CONTAINER="1",ZERO_LOG_FORMAT="json"

# ---- Storage (autostart=false, started by entrypoint when ENABLE_STORAGE=1) ----
[program:fake-gcs]
command=fake-gcs-server -host 0.0.0.0 -port 4443 -scheme http -external-url http://localhost:4443 -data /data/gcs
autostart=false
autorestart=true
startsecs=3
stdout_logfile=/var/log/fake-gcs.log
stderr_logfile=/var/log/fake-gcs.err
priority=40

[program:minio]
command=minio server /data/minio --console-address ":9001"
autostart=false
autorestart=true
startsecs=3
stdout_logfile=/var/log/minio.log
stderr_logfile=/var/log/minio.err
priority=40
environment=MINIO_ROOT_USER="minioadmin",MINIO_ROOT_PASSWORD="minioadmin"

[program:ysweet]
command=y-sweet serve --host 0.0.0.0 --port 8080 --checkpoint-freq-seconds 10 /data/ysweet
autostart=false
autorestart=true
startsecs=3
stdout_logfile=/var/log/ysweet.log
stderr_logfile=/var/log/ysweet.err
priority=40
environment=Y_SWEET_OTEL_ENDPOINT="http://localhost:4318/v1/metrics",Y_SWEET_OTEL_SERVICE_NAME="y-sweet",Y_SWEET_OTEL_PUSH_INTERVAL="30"

# ---- Calls (autostart=false, started by entrypoint when ENABLE_CALLS=1) ----
[program:livekit]
command=livekit-server --config /etc/dev-infra/configs/livekit.yaml --dev
autostart=false
autorestart=true
startsecs=3
stdout_logfile=/var/log/livekit.log
stderr_logfile=/var/log/livekit.err
priority=40
environment=LIVEKIT_API_KEY="devkey",LIVEKIT_API_SECRET="devsecret"

# ---- Feature Flags (autostart=false, started when ENABLE_FEATURE_FLAGS=1) ----
[program:superposition]
command=superposition
autostart=false
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/var/log/superposition.log
stderr_logfile=/var/log/superposition.err
priority=40
environment=SUPERPOSITION_TOKEN="123456",SUPERPOSITION_ORG_ID="localorg",SUPERPOSITION_WORKSPACE_ID="test",REDIS_URL="redis://localhost:6379"

# ---- Observability (autostart=false, started when ENABLE_OBSERVABILITY=1) ----
[program:otel-collector]
command=otelcol-contrib --config /etc/dev-infra/configs/otel-collector-config.yaml
autostart=false
autorestart=true
startsecs=3
stdout_logfile=/var/log/otel-collector.log
stderr_logfile=/var/log/otel-collector.err
priority=50

[program:victoriametrics]
command=victoria-metrics --storageDataPath=/data/victoriametrics --httpListenAddr=:8428 --retentionPeriod=12 --promscrape.config=/etc/dev-infra/configs/scrape.yml
autostart=false
autorestart=true
startsecs=3
stdout_logfile=/var/log/victoriametrics.log
stderr_logfile=/var/log/victoriametrics.err
priority=50

[program:grafana]
command=grafana-server --homepath=/usr/share/grafana
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/var/log/grafana.log
stderr_logfile=/var/log/grafana.err
priority=60
environment=GF_SECURITY_ADMIN_USER="admin",GF_SECURITY_ADMIN_PASSWORD="admin",GF_USERS_ALLOW_SIGN_UP="false",GF_SERVER_ROOT_URL="http://localhost:3333"
