apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: xyne-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      containers:
        - name: sandbox-router
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router:latest-main
          ports:
            - containerPort: 8080
          env:
            - name: PROXY_TIMEOUT_SECONDS
              value: "300"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: xyne-apps
spec:
  type: ClusterIP
  selector:
    app: sandbox-router
  ports:
    - name: http
      port: 8080
      targetPort: 8080
