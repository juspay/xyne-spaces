apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: kata-workspace-template
  namespace: xyne-apps
spec:
  podTemplate:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      runtimeClassName: kata-qemu
      tolerations:
        - key: workload
          value: xyne-claw
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-nodepool
                    operator: In
                    values:
                      - kata-sandbox-ng
      containers:
        - name: workspace
          image: asia.gcr.io/xyne-spaces/kata-workspace:2136e1f67e-v4
          ports:
            - containerPort: 8888
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: "2"
              memory: "5Gi"
            limits:
              cpu: "2"
              memory: "5Gi"
          securityContext:
            privileged: true
